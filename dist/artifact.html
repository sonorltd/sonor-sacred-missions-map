 ["Wishing Well, Castley", "well", "en", 53.90698, -1.58769, "Spring beneath Chapel Hill above the Wharfe, under a hawthorn, where village girls once made wishes; tradition placed a small chapel above it. Now just a boggy patch in the trees.", "https://www.thenorthernantiquarian.org/2025/09/20/wishing-well/"], ["Fairy Well, Nostell", "well", "en", 53.63638, -1.40356, "Well beside Fairy Wood near Nostell remembered in a local poem as a haunt of the little folk, who left when industry came; probable site only.", "https://www.thenorthernantiquarian.org/2024/01/11/fairy-well-nostell/"], ["St Helen's Well, Barmby-on-the-Marsh", "well", "en", 53.74755, -0.9551, "Chalybeate well in St Helen's churchyard said to have medicinal powers; filled in during the 19th century and now remembered only in local memory.", "https://www.thenorthernantiquarian.org/2023/12/23/st-helens-well-barmby/"], ["St Peter's Well, Barmby-on-the-Marsh", "well", "en", 53.74682, -0.9536, "Sulphurous spring credited in 1831 with curing skin eruptions when applied externally; reportedly filled in during the 19th century and its exact position is now uncertain.", "https://www.thenorthernantiquarian.org/2023/11/24/st-peters-well-barmby/"], ["St Ann's Well, Welton", "well", "en", 53.73138, -0.54288, "Holy well that once supplied Welton House, possibly the source of the village name; it survives under stone slabs in a copse north of St Anne's College.", "https://www.thenorthernantiquarian.org/2023/06/18/st-anns-well-welton/"], ["Fairy Well, Liversedge", "well", "en", 53.70392, -1.70193, "Ruined little well house beneath a sycamore, marked on the 1854 map; its fairy folklore is forgotten and water now seeps into a small bog nearby.", "https://www.thenorthernantiquarian.org/2023/05/05/fairy-well-liversedge/"], ["Old Wives' Well (Nattie Fontein), Stape", "well", "en", 54.33597, -0.77967, "Spring bubbling into a small stone-lined chamber on the moors near Pickering, its lintel crudely carved 'Nattie Fontein'; the 'Old Wife' name may recall an ancient earth goddess.", "https://www.thenorthernantiquarian.org/2022/09/28/old-wives-well/"], ["Holy Well, South Crosland", "well", "en", 53.63717, -1.81796, "Spring emerging from a blasted rock face into a round trough beside an older square cistern, remembered locally as a wishing well; often choked with litter.", "https://www.thenorthernantiquarian.org/2021/10/10/holy-well-hudds/"], ["St Peter's Well, Leeds (North Hall)", "well", "en", 53.79993, -1.56202, "Intensely cold spring near North Hall, long thought good for rheumatism and rickets and once served by a bathing house; covered over by 1846.", "https://www.thenorthernantiquarian.org/2021/06/08/st-peters-well1/"], ["St Faith's Well, Leven", "well", "en", 53.89535, -0.34084, "Well by St Faith's Lane near the old churchyard, once the only drinking water for the Carrs; filled in c.1820 and its site re-found by a water diviner.", "https://www.thenorthernantiquarian.org/2021/04/20/st-faiths-well-leven/"], ["St Philip's Well, Keyingham", "well", "en", 53.71174, -0.12899, "Wishing well tied to the local saint Philip Inglebred, with a stone dated 1667; country girls dropped pins or sixpences in for luck. Now filled in, leaving only boggy ground.", "https://www.thenorthernantiquarian.org/2021/04/10/st-philips-well-keyingham/"], ["St Hilda's Well (Seynt-Hild-keld), Whitby", "well", "en", 54.48658, -0.61125, "Spring near Grape Lane in Whitby recorded in 1396, later marked by the 'Virgin Pump' on Church Street; now destroyed, its site under a car park.", "https://www.thenorthernantiquarian.org/2021/04/01/st-hildas-well-whitby/"], ["St Everilda's Well, Everingham", "well", "en", 53.87274, -0.77672, "Well of the 7th-century local saint Everilda in the grounds of Everingham Priory, once open to villagers and praised for abundant excellent water; filled in before 1923.", "https://www.thenorthernantiquarian.org/2021/02/17/st-everildas-well/"], ["Low Well, Bradford", "well", "en", 53.77802, -1.76028, "Seemingly ordinary public well that local lore made Bradford's most supernatural water, haunted by ghosts and black dogs and used for scrying the future at 6 am.", "https://www.thenorthernantiquarian.org/2020/04/17/low-well-bradford/"], ["Halliwell (Holy Well), Baildon", "well", "en", 53.85252, -1.75682, "Forgotten holy well below Halliway Banks Wood, recorded as Haliwell Bank in 1490 and reached by its own dedicated footpath on the 1852 map.", "https://www.thenorthernantiquarian.org/2019/06/14/holy-well-baildon/"], ["Cloven Hoof Well, Shipley Glen", "well", "en", 53.85006, -1.80632, "Free-flowing, drinkable spring in mossy Shipley Glen, mapped in 1852 as Raygate Well; a hoof-print mark on the rock below gives it its devilish name.", "https://www.thenorthernantiquarian.org/2019/06/12/cloven-hoof-well/"], ["St Peter's Well, Leeds (St Peter's Square)", "well", "en", 53.79825, -1.53312, "Intensely cold sulphurous spring at the foot of High Street, used for cold bathing against rheumatism and rickets according to Ralph Thoresby in 1715; long built over.", "https://www.thenorthernantiquarian.org/2019/05/16/st-peters-well-leeds/"], ["Tun Well, Eccleshill", "well", "en", 53.81938, -1.72465, "Deep village well recorded from 1618 under a large slab on Tunwell Lane, a drought-time supply; folklore placed a phantom black dog and a white lady on the lane.", "https://www.thenorthernantiquarian.org/2018/12/19/tun-well-eccleshill/"], ["Brandy Well, Carlton Bank", "well", "en", 54.42423, -1.19235, "Roadside spring halfway up Carlton Bank whose peat-filtered water was said to have wonderful curative powers, with wishes made while drinking likely to come true; location approximate.", "https://www.thenorthernantiquarian.org/2018/12/19/brandy-well-carlton/"], ["Mannerly (Manor Lea) Well, Gomersal", "well", "en", 53.72238, -1.6821, "One of Gomersal's main wells, where boys filled bottles with liquorice and treacle on Palm Sunday to make sweet 'Spanish water' and swap tastes.", "https://www.thenorthernantiquarian.org/2018/02/14/mannerly-well-gomersal/"], ["Lady Well, Leeds", "well", "en", 53.79902, -1.53683, "Copious spring of soft water by Lady Lane near Quarry Hill, close to the medieval Chantry of Our Lady; now lost beneath city buildings.", "https://www.thenorthernantiquarian.org/2018/02/14/lady-well-leeds/"], ["St Francis' Well, Conisbrough", "well", "en", 53.48349, -1.23105, "Town well near the castle under a small steep-roofed conduit house; legend says a local holy man struck the spring from the ground during a drought in 1320-21. Now dry.", "https://www.thenorthernantiquarian.org/2018/02/06/st-francis-well-conisborough/"], ["St Peter's Well, York Minster", "well", "en", 53.96232, -1.08112, "Ancient spring in the crypt of York Minster, traditionally where King Edwin was baptised at Easter 627, prompting the first wooden church on the site; no longer open to visitors.", "https://www.thenorthernantiquarian.org/2018/02/05/st-peters-well-york-minster/"], ["Spink Well, Bradford", "well", "en", 53.80298, -1.75042, "Spring below which Spinkwell House offered health-giving cold baths from 1788; gravestones of 1645 plague victims were built into its well house. Now neglected and muddy.", "https://www.thenorthernantiquarian.org/2013/08/30/spink-well/"], ["Lady Well, Hartshead", "well", "en", 53.70751, -1.73055, "Clear spring flowing into a stone trough beneath an old hawthorn on Lady Well Lane leading to St Peter's Church; local tradition links it to baptisms by St Paulinus and to Robin Hood.", "https://www.thenorthernantiquarian.org/2013/06/30/lady-well-hartshead/"], ["Birley Spa, Sheffield", "spring", "en", 53.34785, -1.38701, "Spring developed as a cold bath in the early 1700s and rebuilt as a seven-bath spa by Earl Manvers in 1843; the restored bath house opens to the public on volunteer open days.", "https://www.thenorthernantiquarian.org/2013/04/07/birley-spa-birley-sheffield/"], ["Crutch Well, Baildon", "spring", "en", 53.84423, -1.7784, "Clear medicinal spring mapped in 1851, said never to run dry; it flows beneath the Cricketer's Arms opposite, keeping the cellar cool, with a cup-marked stone just above.", "https://www.thenorthernantiquarian.org/2012/03/29/crutch-well/"], ["St Helen's Well, Eshton", "well", "en", 54.0089, -2.10683, "One of the most copious springs in England, boiling up into a circular pool by the road near Eshton Hall, recorded with a chapel in 1429; offerings are still tied to nearby shrubs. A listed monument.", "https://www.thenorthernantiquarian.org/2011/12/28/st-helens-well-eshton/"], ["Horncliffe Well, Hawksworth Moor", "well", "en", 53.88596, -1.80045, "Renowned moorland well recorded in 1273 at the meeting point of three townships, famed for never running dry even in 1976; sadly its flow has since failed.", "https://www.thenorthernantiquarian.org/2011/12/06/horncliffe-well/"], ["New Edge Chalybeate, Colden", "spring", "en", 53.76096, -2.07054, "Iron-rich spring trickling from an old stone trough beside New Edge above Colden, staining everything rust-red; such waters were valued for the blood and fatigue.", "https://www.thenorthernantiquarian.org/2011/11/08/new-edge-chalybeate/"], ["St George's Well, Harrogate", "spring", "en", 53.99571, -1.54426, "Walled chalybeate spring off Parliament Street rediscovered c.1792, locally valued as an eye-wash for sore eyes before becoming one of Harrogate's spa wells; now lost.", "https://www.thenorthernantiquarian.org/2023/04/15/st-georges-well-harrogate/"], ["St Sennen's Well, Sennen Cove", "well", "en", 50.07751, -5.69824, "Holy well 'of some repute' by the old Chapel Idne at Sennen Cove, whose water features in the Arthurian legend of the battle of Vellan-druchar; now lost, probably one of two mapped springs.", "https://www.thenorthernantiquarian.org/2023/09/28/holy-well-sennon/"], ["Holy Well, Lawhitton (Barton Farm)", "well", "en", 50.61916, -4.32725, "Holy well in a valley north of St Michael's church, recorded in 1914 and visited in 1980; by 1998 only a natural basin by a small bridge remained.", "https://www.thenorthernantiquarian.org/2023/09/23/holy-well-lawhitton/"], ["St George's Well (Fons George), Wilton", "well", "en", 51.01337, -3.09688, "Noted spring south of St George's church in Wilton, Taunton, where the afflicted came for cures said to be marvellous; its site was already uncertain by 1873, location approximate.", "https://www.thenorthernantiquarian.org/2026/09/03/st-georges-well-taunton/"], ["St Chad's Well, Logierait", "well", "en", 56.64834, -3.68505, "Renowned holy well behind Logierait church; tradition says its spirit was so offended when the saint's-day market on 22 August was stopped that the water vanished.", "https://www.thenorthernantiquarian.org/2026/06/06/st-chads-well/"], ["St Bride's Well, Port-na-Craig, Pitlochry", "well", "en", 56.69899, -3.73304, "Well by the medieval monks' ferry over the Tummel, dedicated to St Bride so travellers could seek her protection, usually by dropping in a brass pin or coin; lost about a century ago.", "https://www.thenorthernantiquarian.org/2025/09/30/st-brides-well/"], ["St Ninian's Well, Blairgowrie", "well", "en", 56.59197, -3.33606, "Well in Blairgowrie's Wellmeadow where tradition says St Ninian camped, drank and baptised converts; later covered over and piped into the town drains.", "https://www.thenorthernantiquarian.org/2022/12/25/st-ninians-well-blairgowrie/"], ["Whooping Cough Well (Sput na Fruith-chasd), Strathtay", "well", "en", 56.6683, -3.7712, "Spring spouting from a high rock by the Tullypowrie Burn, resorted to for curing whooping cough and counted among the three most important wells of the Tay valley; now overgrown.", "https://www.thenorthernantiquarian.org/2026/06/24/whooping-cough-well/"], ["Kinkhoast Well, Comrie", "well", "en", 56.39188, -4.00736, "Whooping-cough healing well in the hills above Comrie, recently revived and signposted by locals; its little pool is full of smooth white quartz pebbles left as offerings.", "https://www.thenorthernantiquarian.org/2026/03/31/kinkhoast-well/"], ["Lady's Well, Kincardine (Ardgay)", "well", "en", 57.87358, -4.34985, "Spring of excellent water at the foot of the 'Bank of the Gate' below the old Clan Ross castle site; the Ordnance Survey found it under the sea at high tide.", "https://www.thenorthernantiquarian.org/2023/10/16/lady-well-ardgay/"], ["Holy Well, Glen Prosen", "well", "en", 56.78786, -3.11917, "Clear iron-bearing spring in remote Glen Prosen, reached by a straight stone-lined path from a ruined 17th-century chapel; a scatter of quartz stones may once have ringed it. Still drinkable.", "https://www.thenorthernantiquarian.org/2023/05/20/holy-well-glen-prosen/"], ["Tobar Ruadh (Red Well), Heaste, Skye", "spring", "en", 57.20811, -5.87487, "Roadside chalybeate well between Broadford and Heaste where travellers drank from a pewter mug; fishermen took its water to pregnant women in Elgol. Recently cleared, with a tin mug left at the roadside.", "https://www.thenorthernantiquarian.org/2025/10/17/58909/"], ["St Mary's Well, Inchberry", "well", "en", 57.58181, -3.1324, "Holy well and pool beside the Spey behind the Duff family mausoleum; pilgrims came on the first Sunday in May, leaving a stone offering, and its water was said to cure whooping cough, eye and joint troubles.", "https://www.thenorthernantiquarian.org/2025/07/12/st-marys-well-inchberry/"], ["Holy Well by Loch ma Naire, Strathnaver", "well", "en", 58.45426, -4.18578, "Lost holy well near Loch ma Naire, where crowds came twice yearly before sunrise to bathe, walk round the loch, drink from the well and throw in coins for cures; location approximate.", "https://www.thenorthernantiquarian.org/2023/11/11/holy-well-farr/"], ["St Helen's Well, Maybole", "well", "en", 55.38569, -4.6643, "Well on the old road to Ayr, famous in the 17th century for curing 'unthriving children', with crowds gathering especially at May Day; covered over in the 1950s.", "https://www.thenorthernantiquarian.org/2023/06/26/st-helens-well-maybole/"], ["Sulphur Well, Earlston", "spring", "en", 55.6292, -2.61738, "One of Earlston's old 'verter' (virtue) wells, a sulphurous moorland spring whose 'gunpowder'-tasting water a local farmer credited with curing a serious internal complaint; lost in the 1800s, location approximate.", "https://www.thenorthernantiquarian.org/2026/10/26/sulphur-well/"], ["St Patrick's Well, Old Kilpatrick", "well", "en", 55.92612, -4.46127, "Well beside the church in the village that tradition claims as St Patrick's birthplace, used for baptisms and by villagers for centuries until closed in the 1890s; a later fountain nearby carried the name.", "https://www.thenorthernantiquarian.org/2024/02/10/st-patricks-well-kilpatrick/"], ["Holy Well, Tuxford", "well", "en", 53.2353, -0.88835, "Cold spring by Holywell Farm reputed to cure scurvy and other skin diseases and to help rheumatism, used for water until the 1920s; now a boggy patch.", "https://www.thenorthernantiquarian.org/2026/04/28/holywell-tuxford/"], ["Druid's Well, Sutton Park", "well", "en", 52.57964, -1.85147, "Spring beyond Bracebridge Pool in Sutton Park, once under a well house and much frequented in the 19th century; probably originally dedicated to St Mary. Now a stone-lined hole.", "https://www.thenorthernantiquarian.org/2025/03/20/druids-well/"], ["St John's Well, Berkhamsted", "well", "en", 51.76406, -0.57432, "Holy well, first linked to St James's chapel, where pagan-style rites drew a reprimand from Bishop Hugh of Lincoln in the 12th century; later a pilgrimage site whose water served a leper hospital.", "https://www.thenorthernantiquarian.org/2024/12/15/st-johns-well-berkhampstead/"], ["St Cuthbert's Well, Bonnington (Leith)", "spring", "en", 55.97133, -3.18536, "Chalybeate well by the Water of Leith, given a well house c.1818 where visitors paid a penny a drink; analysed as rich in iron salts, but destroyed in the 19th century.", "https://www.thenorthernantiquarian.org/2024/11/22/stcuthbertswell/"], ["St Stephen's Well, Banbury", "spring", "en", 52.06155, -1.34409, "Slow chalybeate spring on the west side of Banbury, still often visited in 1841 and leaving a red deposit in its stone channel; built over later in the century.", "https://www.thenorthernantiquarian.org/2024/11/04/st-stephens-well/"], ["Holy Well, Shoreditch", "well", "en", 51.52527, -0.07883, "The 'Haliwelle' recorded c.1100 that named Holywell Lane and the medieval priory, once sweet and frequented by scholars on summer evenings but spoiled by 1603; long destroyed.", "https://www.thenorthernantiquarian.org/2023/08/25/holy-well-shoreditch/"], ["St John's Well, Winkburn", "well", "en", 53.13009, -0.9545, "Holy well near Holywell Farm, probably linked to the Knights Hospitallers who held Winkburn manor; its water was said to be good for sore eyes. Now an overgrown muddy patch.", "https://www.thenorthernantiquarian.org/2026/05/01/st-johns-well-winkburn/"], ["Bride's Well, Ballintemple", "well", "en", 52.83494, -6.25959, "Well beside a stream just north-west of an old church site in Co. Wicklow, probably dedicated to St Brigid; still visible in 1927 but now in woodland and condition unknown.", "https://www.thenorthernantiquarian.org/2021/04/12/brides-well-ballintemple/"], ["St Patrick's (Chapel) Well, Struthill", "well", "en", 56.31691, -3.85183, "Spring beside the overgrown ruins of a chapel by the Machany Water, so venerated that the Presbytery ordered the chapel demolished c.1650 to suppress the 'superstitions' practised there; now a boggy seep.", "https://www.thenorthernantiquarian.org/2021/11/02/st-patricks-well2/"], ["St Serf's Well, Ochtertyre", "well", "en", 56.38725, -3.87112, "Plentiful spring of St Serf, patron of Monzievaird, where on Lammas Day people drank and left white stones, spoons or rags; now drowned beneath the waters of the loch at Ochtertyre.", "https://www.thenorthernantiquarian.org/2020/11/24/st-serfs-well-crieff/"], ["Mineral Wishing Well, Glen Lyon", "spring", "en", 56.6043, -4.08493, "Gushing roadside mineral spring in Glen Lyon with a stone shelf for offerings, usually small pebbles, which were said to be replaced as fast as roadmen cleared them; offerings were still remembered in recent times.", "https://www.thenorthernantiquarian.org/2019/05/17/mineral-well-glen-lyon/"], ["Lady Well, Tibbermore", "well", "en", 56.39403, -3.53746, "Holy well of St Mary that gave Tibbermore ('great well') its name, near a church once held by the Bishops of Dunkeld; its site in a roadside paddock now shows no trace.", "https://www.thenorthernantiquarian.org/2018/12/25/lady-well-tibbermore/"], ["Chapel Well, Berryhill (Bankfoot)", "well", "en", 56.49462, -3.59044, "Holy well by a lost chapel and burial ground on the banks of the Ordie, where locals drank on the first Sunday of May until the 19th century; destroyed c.1850, site now in forestry.", "https://www.thenorthernantiquarian.org/2018/12/25/chapel-well-bankfoot/"], ["St Patrick's Well, Dunruchan", "well", "en", 56.33287, -3.97635, "Boggy remnant of a holy well beside the lost chapel site just east of the Dunruchan standing stones; one of two St Patrick's wells in Muthill parish.", "https://www.thenorthernantiquarian.org/2018/12/19/st-patricks-well-dunruchan/"], ["Holy Well of Inchadney (Beltane Well), Kenmore", "well", "en", 56.60144, -3.97782, "Quartz-edged well near a vanished church of the 'Holy Women', visited by crowds on Beltane morning until the mid-19th century; cleaning in 1914 turned up coins, buttons and a cross-marked stone.", "https://www.thenorthernantiquarian.org/2018/12/11/beltane-well-kenmore/"], ["Trinity Well, Trinity Gask", "well", "en", 56.34408, -3.67905, "Spring south of the manse famed in pre-Reformation times for miraculous cures and protection against plague and witchcraft; still flowing from a wooded bank in 2014.", "https://www.thenorthernantiquarian.org/2014/11/18/trinity-well/"], ["St Mungo's Well, Gleneagles", "well", "en", 56.24536, -3.71588, "Strong cold spring gathering into a clear pool amid gorse in the Ochil foothills, mapped in 1860; no recorded traditions survive.", "https://www.thenorthernantiquarian.org/2014/05/10/st-mungos-well/"], ["St David's (St Cuthbert's) Well, Weem", "well", "en", 56.62777, -3.88497, "Trickle collecting in a small stone pool beneath the crags of Weem Wood, once called St Cuthbert's Bath; later named for Sir David Menzies, who restored it and lived as a hermit in the nearby cave. Plaque and modern cross mark it.", "https://www.thenorthernantiquarian.org/2013/11/12/st-davids-well/"], ["St Mary's Well, Callander", "well", "en", 56.22345, -4.17767, "Quartz-lined holy well by the river at Callander, mapped in 1862 though overlooked by Scottish holy well surveys; still holding fresh water.", "https://www.thenorthernantiquarian.org/2013/06/05/st-marys-well/"], ["Maiden's Well, Glendevon", "well", "en", 56.194, -3.66088, "Fine stone-bordered spring below fairy-haunted Maiden Castle, said never to fail; legend says a princess imprisoned in Castle Campbell was allowed out to drink here.", "https://www.thenorthernantiquarian.org/2013/04/02/maidens-well/"], ["St Fillan's Well, Dundurn (Comrie)", "well", "en", 56.38404, -4.09401, "Healing spring said to have moved from the top of Dundurn hill to its foot in disgust; in 1791 seventy invalids came on 1 May and 1 August, walking sunwise three times, bathing, casting white stones on the saint's cairn and leaving rags. Especially sought by the childless.", "https://www.thenorthernantiquarian.org/2012/10/23/st-fillans-well/"], ["St Bennet's Well, Cromarty", "well", "en", 57.65887, -4.02565, "Clootie well near the high-water mark below the ruined St Bennet's Chapel, where the sick drank and hung rags as offerings; in the 1930s wishers still left a scrap of clothing on the branches.", "https://www.thenorthernantiquarian.org/2020/11/27/st-bennets-well/"], ["Holy Well of Isle Maree, Loch Maree", "well", "en", 57.69336, -5.47307, "Well of St Maelrubha on a sacred island in Loch Maree, famed for curing insanity; beside it stood a wishing tree so studded with hammered-in coins that it died. Reached only by boat.", "https://www.thenorthernantiquarian.org/2008/09/12/isle-maree/"], ["St Francis' Well, Dundee", "well", "en", 56.4625, -2.97407, "Cold spring on the sunny slopes of the Greyfriars' meadows north of the Howff, dedicated by the friars and reckoned the favourite of Dundee's holy wells; repaired after the Reformation but long since lost.", "https://www.thenorthernantiquarian.org/2021/10/12/st-francis-well-dundee/"], ["Lady Well, Dundee", "well", "en", 56.46486, -2.97105, "Bright spring flowing from under the Chapelshade braes near the old Chapel of Our Lady, recorded in 1409 and later feeding the town's water supply; now drained beneath the Ladywell roundabout.", "https://www.thenorthernantiquarian.org/2021/05/30/lady-well-dundee/"], ["St Mary's Well, Lethnot", "well", "en", 56.80257, -2.75067, "Natural spring at the foot of a bank near Lethnot church, where silver coins left as votive offerings were found in the 19th century; the parish name may come from a word for a sacred place.", "https://www.thenorthernantiquarian.org/2018/11/17/st-marys-well-lethnot/"], ["St Aidan's (St Iten's) Well, Menmuir", "well", "en", 56.76646, -2.76402, "Well by Menmuir church named for St Aidan of Lindisfarne, believed to cure asthma and skin diseases; drained in the 19th century, though water still issues from a roadside spout.", "https://www.thenorthernantiquarian.org/2018/11/17/st-aidans-well/"], ["Holy Well, Balmossie Den", "well", "en", 56.48356, -2.85864, "Old wishing or holy well of Monifieth on the north side of the A92 at Balmossie Bridge, marked by a stone set up by Thomas Erskine in 1847 on the supposed medieval site, inscribed 'Whosoever drinketh of this water shall thirst again'.", "https://www.thenorthernantiquarian.org/2018/11/17/holy-well-balmossie-den/"], ["Lady Well, Airth", "well", "en", 56.05883, -3.77125, "Holy well below Airth Castle whose visitors were hauled before the kirk session in 1657 for leaving money, walking in silence and keeping the water from touching the ground; now destroyed.", "https://www.thenorthernantiquarian.org/2018/12/19/lady-well-airth/"], ["St Ninian's Well, Stirling", "well", "en", 56.11465, -3.93644, "Ancient well in an old stone well house that gave its name to the St Ninians district of Stirling, beside a demolished chapel recorded from 1242.", "https://www.thenorthernantiquarian.org/2018/12/16/st-ninians-well-stirling/"], ["St Maha's Well, Balmaha", "well", "en", 56.09406, -4.4813, "Healing spring high on the boggy moors above Balmaha, overlooking the islands of Loch Lomond; the village name is thought to come from the same saint.", "https://www.thenorthernantiquarian.org/2018/12/16/st-mahas-well/"], ["Our Lady's Well, Stirling", "well", "en", 56.12833, -3.943, "Holy well at the northern foot of Gowan Hill below Stirling Castle, drawn by J.S. Fleming in 1898; built over and destroyed in the 20th century.", "https://www.thenorthernantiquarian.org/2018/12/16/our-ladys-well-stirling/"], ["Airthrey Mineral Wells, Bridge of Allan", "spring", "en", 56.15658, -3.94154, "Cold mineral springs below the Ochils, noted by Defoe as useful against skin complaints, whose fame turned Bridge of Allan into a Victorian spa town; the old well house survives as a ruin.", "https://www.thenorthernantiquarian.org/2018/12/15/airthrey-mineral-wells/"], ["Holy (Fairy) Well, Logie", "well", "en", 56.16026, -3.91192, "'Very fine well' at the foot of Dumyat rising from over sixty springs through sand, described in 1792 as much resorted to by Catholics; still runs clear.", "https://www.thenorthernantiquarian.org/2018/12/15/fairy-well-logie/"], ["Chapel Well (Christ's Well), Cambusbarron", "well", "en", 56.10971, -3.96634, "Called the most famous of Stirling's holy wells, a village water supply and ritual site whose customs drew repeated church complaints; now marked only by a notice board.", "https://www.thenorthernantiquarian.org/2018/12/15/chapel-well-cambusbarron/"], ["Christ's Well, Blair Drummond", "well", "en", 56.16579, -4.04807, "Well where local people practised healing rites condemned in old church records, probably the 'Christ's Well' of Menteith described in 1618 as hung all about with rags; exact location disputed.", "https://www.thenorthernantiquarian.org/2018/12/15/christs-well-blair-drummond/"], ["St Corbet's Well, Touch Glen", "well", "en", 56.109, -4.03007, "Lonely spring in Touch Glen near Gilmour's Linn whose virtue lasted one hour a year: drinking at sunrise on the first Sunday of May was believed to preserve your life for twelve months. Long reduced to a boggy spring, location approximate.", "https://www.thenorthernantiquarian.org/2012/10/29/st-corbets-well/"], ["St Finglassin's Well, Kinglassie", "well", "en", 56.17569, -3.2451, "Holy well of the saint who gave Kinglassie its name, sheltered by hawthorn and elder; the spring has been piped and bricked for water supply.", "https://www.thenorthernantiquarian.org/2018/12/19/st-finglassins-well/"], ["St Andrew's Well, Isle of May", "well", "en", 56.18769, -2.55946, "Walled spring beside the Altar Stones on the Isle of May, the island's best water and its main domestic supply, though prone to drying in summer.", "https://www.thenorthernantiquarian.org/2017/05/18/st-andrews-well-may/"], ["Our Lady's Well, Gateside", "well", "en", 56.26798, -3.3174, "Small spring by the mill dam at Gateside beside the supposed site of St Mary's Chapel, remembered as a source of holy water before the Reformation.", "https://www.thenorthernantiquarian.org/2016/11/08/our-ladys-well-gateside/"], ["Tobar Mor (Well of the Winds), Gigha", "well", "en", 55.70379, -5.73157, "Magical well on Cnoc Largie kept by an old woman guardian who, for silver, would clean it with a white clamshell, stir it sunwise and fling water toward the wind wanted by sailors; left uncovered it was said it could flood the island.", "https://www.thenorthernantiquarian.org/2010/03/04/tobar-mor-gigha/"], ["Tobar na h-Aoise (Well of Age), Iona", "well", "en", 56.34149, -6.39684, "Natural pool near the summit of Dun I on Iona, the 'well of eternal youth', where pilgrims came at dawn to touch the water as the first sunbeam struck it to renew their youth.", "https://www.thenorthernantiquarian.org/2009/09/03/tobar-na-h-aoise-iona/"], ["Tobar na Gaoithe Tuath (North Wind Well), Iona", "well", "en", 56.34096, -6.41046, "Lost magic well north of Cnoc nam Bradhan near the Hermit's Cell, where sailors left offerings to summon a north wind; location approximate.", "https://www.thenorthernantiquarian.org/2008/09/12/tobar-na-gaoithe-tuath-iona/"], ["Tobar nam Buadh (Well of Virtues), St Kilda", "well", "en", 57.81983, -8.59579, "Exceedingly cold spring near the Amazon's House on Hirta, described by Martin Martin in 1703 as a cure for colic, gravel and headaches; votaries once left humble offerings on a stone altar beside it.", "https://www.thenorthernantiquarian.org/2008/09/12/tobar-nam-buadh-st-kilda/"], ["Lighthouse Well, Dunnet Head", "well", "en", 58.66276, -3.37346, "The most northerly healing well on mainland Britain, a stone-surrounded spring with two troughs that also served the keepers of Dunnet Head lighthouse, who carried its water half a mile uphill.", "https://www.thenorthernantiquarian.org/2016/11/21/lighthouse-well/"], ["Trows Well, Birsay", "well", "en", 59.12194, -3.29161, "Spring by the Loch of Boardhouse in Orkney once believed to be the home of a trow, the island troll; its folklore is now forgotten but the spring still flows.", "https://www.thenorthernantiquarian.org/2022/05/10/trows-well/"], ["Tobar na Cailleach, Keith", "well", "en", 57.51428, -2.9588, "Woodland 'well of the old woman' on Cairds Hill, once known for curing ailments and linked to a tale of the Cailleach bathing here and emerging young; still running as a dammed pool.", "https://www.thenorthernantiquarian.org/2010/03/31/tobar-na-cailleach-banffshire/"], ["White Wells, Ilkley Moor", "spring", "en", 53.91699, -1.8216, "Celebrated healing spring on Ilkley Moor, enclosed c.1760 by Squire Middleton in a white bath house with plunge baths for the 'cold water cure'; the building is open and water still runs into a plunge pool.", "https://www.thenorthernantiquarian.org/2008/09/12/white-wells-ilkley/"], ["Holy Well, Hildenley", "well", "en", 54.13011, -0.86775, "Copious pure spring at the edge of Hildenley Wood near Malton running into a small well house and pool, said to have been much used by the monks of Kirkham Abbey and still credited with healing virtues in 1859.", "https://www.thenorthernantiquarian.org/2010/11/03/holy-well-hildenley/"], ["St Helen's Well, Thorp Arch", "well", "en", 53.9064, -1.31401, "Ancient healing spring by St Helen's Beck in Chapel Wood near the Wharfe, close to a lost chapel and cross at St Helen's Ford; reputedly haunted and venerated since pre-Roman times.", "https://www.thenorthernantiquarian.org/2011/07/24/st-helens-well-thorp-arch/"], ["St Helen's Well, Holbeck", "spring", "en", 53.79203, -1.55292, "Medicinal holy well by St Helen's Bridge in Holbeck, once beside a chapel, later known as the Holbeck Spa Well; lost to industrial Leeds.", "https://www.thenorthernantiquarian.org/2010/01/17/st-helens-well-holbeck/"], ["St Lambert's Well, Burneston", "well", "en", 54.25943, -1.52724, "St Lambert's 'fountain', recorded in the 12th century and probably in the present churchyard; it is thought to have given its name to the Halikeld ('holy spring') wapentake.", "https://www.thenorthernantiquarian.org/2009/05/04/st-lamberts-well-burneston/"], ["St Michael's Well, Well", "well", "en", 54.23092, -1.59751, "One of the springs that named the village of Well, where an iron cup once hung for travellers; a Roman bath house stood nearby.", "https://www.thenorthernantiquarian.org/2009/04/25/st-michaels-well/"], ["Holy Well, Todmorden", "well", "en", 53.71611, -2.1008, "Spring of excellent water on the former Holy Well Lane, where local people once left 'memaws' — rags, coins and flowers — as offerings to the water.", "https://www.thenorthernantiquarian.org/2009/01/26/holy-well-todmorden/"], ["Sore Eye Well, Eldwick", "well", "en", 53.85674, -1.8059, "Moorland well where people bathed their faces to cure poor sight and eye complaints, hanging rags on an old rowan tree as offerings; now under a water-authority cover.", "https://www.thenorthernantiquarian.org/2021/04/28/sore-eye-well/"], ["Eyebright Well, Leeds", "well", "en", 53.79529, -1.5481, "Well near the Monk Pits recorded by Ralph Thoresby in 1715 as long esteemed a sovereign remedy for sore eyes; lost to the growth of Leeds in the 19th century.", "https://www.thenorthernantiquarian.org/2021/04/28/eyebright-well-leeds/"], ["Blind Well, Sutton-in-Holderness", "well", "en", 53.78186, -0.30102, "Healing well in the East Field near Spring Cottage Farm where villagers bathed sore eyes; long lost, location approximate.", "https://www.thenorthernantiquarian.org/2021/02/19/blind-well-sutton/"], ["Horley Green Spa, Halifax", "spring", "en", 53.73534, -1.8459, "Chalybeate spring with May Day traditions, enclosed in a spa house and prominent in Calderdale's history from the late 18th to late 19th century.", "https://www.thenorthernantiquarian.org/2020/12/04/horley-green/"], ["Sulphur Well (Spa), Wigglesworth", "spring", "en", 54.00663, -2.29817, "Sulphur spring under a small well house dated 1666, said in 1765 to have been used 'time out of mind' for healing.", "https://www.thenorthernantiquarian.org/2021/08/02/wigglesworth-spa/"], ["Hawklemass Well, Whittingham", "well", "en", 55.40446, -1.89362, "Well with a stone trough near Howbalk Lane end, haunted by the 'Hawklemass Ghost', which village youths dreaded passing after dark.", "https://www.thenorthernantiquarian.org/2018/01/30/hawklemass-well-whittingham/"], ["Lee Hall Well, Bellingham", "well", "en", 55.11195, -2.21865, "'Excellent spring' at Lee Hall where the lady of the hall dipped children with rickets on Whitsun, Midsummer and St Peter's Eves, said to bring either a speedy cure or death; exact spot lost, location approximate.", "https://www.thenorthernantiquarian.org/2010/01/30/lee-hall-well-bellingham/"], ["St Helen's (Freemen's) Well, Hartlepool", "well", "en", 54.70025, -1.18898, "Well in the Far-well Field beside the site of St Helen's Chapel, recorded c.1200; still visible in 1823 but now gone.", "https://www.thenorthernantiquarian.org/2023/06/25/st-helens-well-hartlepool/"], ["Bede's Well, Hebburn", "well", "en", 54.97102, -1.50186, "Well in a small railed amphitheatre, enclosed in 1932, which legend says Bede's monks visited from Jarrow for water; now dry after its spring was diverted by shipyard slag works.", "https://www.thenorthernantiquarian.org/2018/01/30/bedes-well-hebburn/"], ["Worm Well, Fatfield", "well", "en", 54.87993, -1.51595, "Wishing well at the foot of Worm Hill tied to the Lambton Worm legend, where crooked pins were offered and Midsummer Eve festivities held; reportedly restored in 1974.", "https://www.thenorthernantiquarian.org/2009/01/08/worm-well-lambton-durham/"], ["St Martin's Well, Looe", "well", "en", 50.36071, -4.45195, "Spring flowing from a rock on the old parish boundary path above Looe, much used by villagers for its excellent water before being enclosed in a shed and piped to the town.", "https://www.thenorthernantiquarian.org/2023/01/12/st-martins-well-looe/"], ["Holy Well, Gunwalloe", "well", "en", 50.03886, -5.26894, "Rock basin just below the porch of St Winwaloe's church on the shore at Gunwalloe, filled with sand at every high tide; already ruined by 1875.", "https://www.thenorthernantiquarian.org/2020/07/08/holy-well-gunwalloe/"], ["St Agnes' Well, Cothelstone", "well", "en", 51.08014, -3.16698, "Scheduled well in a small well house, said to be a powerful wishing well for divining love, though some locals avoided it as a haunt of mischievous pixies.", "https://www.thenorthernantiquarian.org/2010/03/05/st-agnes-well-cothelstone/"], ["Fairy Well, Barrow Gurney", "well", "en", 51.4147, -2.67373, "Spring in a dip by the stream near Barrow Wood, long visited to bathe sore eyes; a dedicated cup was kept there for drinking.", "https://www.thenorthernantiquarian.org/2009/10/29/fairy-well/"], ["St Columb's Wells, Derry", "well", "en", 54.99516, -7.32709, "Three sacred springs outside Derry's walls named in the annals for Adomnán, Martin and Columba; already declining by 1837, now gone.", "https://www.thenorthernantiquarian.org/2021/08/20/columbas-well-derry/"], ["St Patrick's Well, Grianan of Aileach", "well", "en", 55.02293, -7.42617, "Well between the outer ramparts of the Grianan of Aileach where Patrick is said to have baptised Prince Eoghan; pilgrims once pushed pins into a tree beside it.", "https://www.thenorthernantiquarian.org/2009/11/11/st-patricks-well-donegal/"], ["Our Lady's Well, Liberton", "well", "en", 55.9182, -3.1791, "Virgin Mary's well by the Braid Burn, praised in 1792 for its large flow and light, wholesome water; now lost.", "https://www.thenorthernantiquarian.org/2018/12/09/our-ladys-well1/"], ["Wells o' Wearie, Duddingston", "well", "en", 55.93928, -3.16357, "One of a ring of sacred and healing springs around Arthur's Seat, renowned for its water; disrupted when the railway cut into the hill, site approximate.", "https://www.thenorthernantiquarian.org/2018/12/09/wells-o-wearie/"], ["Druid's Well, Bingley", "spring", "en", 53.85519, -1.85867, "Sweet spring seeping from beneath a lichen-covered boulder below the Druid's Altar crag near Bingley, near the lost 'Altar Well'.", "https://www.thenorthernantiquarian.org/2008/09/07/druids-well-bingley/"], ["Wallace's Well (Well of Spaw), Dunfermline", "well", "en", 56.06957, -3.46681, "Overgrown stone ruin of a reputed spring beside the path through Pittencrieff Glen, dedicated to William Wallace; in 1773 the council fought to keep the townsfolk's right of access to the 'Well of Spaw'.", "https://www.thenorthernantiquarian.org/2021/03/27/wallaces-well-dunfermline/"], ["Vicar's Well, Musselburgh", "well", "en", 55.94237, -3.04983, "Holy well by the Dam Brae, attached to the vicarage of St Michael's church and celebrated in 1857 for the excellence of its water.", "https://www.thenorthernantiquarian.org/2017/04/17/vicars-well-musselburgh/"], ["Twentypenny Well, Duddingston", "well", "en", 55.94101, -3.15178, "Little-known healing well on the slopes of Arthur's Seat, still running clear into a stone trough by the path; its name may recall coin offerings.", "https://www.thenorthernantiquarian.org/2018/12/09/twentypenny-well/"], ["St Michael's Well, Cowgate, Edinburgh", "well", "en", 55.94916, -3.18356, "Holy well of the dragon-slaying archangel near the Cowgate and St Mary's Street, shown on a sketch of the city c.1540; possibly remembered in the later 'Silverwell Close'. Long gone.", "https://www.thenorthernantiquarian.org/2017/10/22/st-michaels-well-edinburgh/"], ["Old Wife's Spring, Snaizeholme", "spring", "en", 54.2581, -2.25562, "Remote spring on a steep slope in Snaizeholme valley whose name may recall the Cailleach or old earth goddess; known only from place-name records.", "https://www.thenorthernantiquarian.org/2008/10/11/old-wifes-spring-snaizholme/"], ["Dragon's Well, Wharncliffe", "well", "en", 53.46072, -1.54142, "Well beneath Wharncliffe Crags where the legendary seven-headed Wharncliffe Dragon was said to drink, close to the Dragon's Den and the 'Old Wife's Cellar'.", "https://www.thenorthernantiquarian.org/2008/09/12/dragons-well-wharncliffe/"], ["Holy Ash Well (Hellywell), Bradford", "well", "en", 53.80393, -1.75942, "Healing spring of wide renown off Manningham Lane, with a Wart or Pin Stone beside it; now under or beside Valley Parade football ground.", "https://www.thenorthernantiquarian.org/2010/01/28/holy-ash-well-bradford/"], ["Claymore Well, Kettleness", "well", "en", 54.52232, -0.73541, "Well near Kettleness where fairies were said to wash their linen and beat it with bittle and pin, the noise carrying a mile on fairy washing nights.", "https://www.thenorthernantiquarian.org/2008/12/29/claymore-well-kettleness/"], ["Craigie Well (Tobar Chragag), Avoch", "well", "en", 57.54933, -4.20859, "Black Isle rag well linked by some to the Virgin Mary, formerly visited on the first Sunday of summer; cloots were still being tied to nearby trees when recorded in 2014, though tree roots are toppling its stones.", "https://her.highland.gov.uk/monument/MHG7112"], ["St Plegmund's Well, Plemstall", "well", "en", 53.2254, -2.81742, "Medieval well dedicated to the Anglo-Saxon archbishop St Plegmund, possibly marking his hermitage; long known locally as a christening well. A scheduled monument, restored in 1907, though now without water.", "https://historicengland.org.uk/listing/the-list/list-entry/1018615"], ["St Oswald's Well, Winwick", "well", "en", 53.44219, -2.59248, "Stone-lined well chamber with steps down to the water, said to mark where King Oswald fell at the battle of Maserfelth; coins and objects were left here for healing. Scheduled monument, well kept by the community.", "https://historicengland.org.uk/listing/the-list/list-entry/1018082"], ["Chibbyr Undin (Well of the Ash), Grenaby", "well", "en", 54.11435, -4.6635, "Manx healing well near Grenaby: the sick drank, walked sunwise round it two or three times, then hung a wetted rag from their clothing on the hawthorn, expecting a cure as the cloth rotted.", "https://www.megalithic.co.uk/article.php?sid=32318"], ["St Maughold's Well", "well", "en", 54.30082, -4.31255, "Cliff-top spring above the sea by Maughold churchyard, said to be blessed by St Maughold; drinking while seated in the saint's rock chair was thought to help, especially women. Pilgrimage on the first Sunday in August; now a few tumbled stones.", "https://isle-of-man.com/manxnotebook/parishes/md/mdwell.htm"], ["St Winefride's Well, Holywell Farm, Clutton", "well", "en", 53.09179, -2.78708, "Large circular stone basin fed by several springs, one of a chain of wells said to mark the route of St Winefride's relics from Holywell to Shrewsbury; a medieval pilgrim station, its worn coping shows long use. Scheduled; in a private farm garden.", "https://historicengland.org.uk/listing/the-list/list-entry/1018702"], ["St Anne's Well, Sutton (St Helens)", "well", "en", 53.41726, -2.75435, "Medieval dressed-sandstone well basin by the brook dividing Rainhill and Sutton, reputed in the 19th century to cure eye complaints; its stone figure of a woman with a pitcher is long lost. Scheduled, partly silted.", "https://historicengland.org.uk/listing/the-list/list-entry/1019449"], ["Scarisbrick Park Holy Well", "well", "en", 53.60121, -2.92685, "Simple medieval roadside spring beside Southport Road, covered by an oval capstone carved with a small floriated cross and linked to the nearby wayside cross; a rare Lancashire survival. Scheduled.", "https://historicengland.org.uk/listing/the-list/list-entry/1009493"], ["Doon Holy Well, Kilmacrenan", "well", "en", 55.02483, -7.82251, "Pilgrimage well near Doon Rock, the O'Donnell inauguration site, said to have been blessed by a fasting priest; pilgrims make barefoot rounds and bathe limbs, and two rag trees hold medals, rosaries and other offerings. Well maintained and still busy.", "https://pilgrimagemedievalireland.com/2022/02/14/doon-holy-well-through-the-ages/"], ["St Declan's Well, Ardmore", "well", "en", 51.94807, -7.7126, "Clifftop wellhouse on St Declan's Way above Ardmore Bay, topped by worn crucifixion carvings; pilgrims make three rounds and drink the water, reputedly good for sore eyes, with a candlelit pattern on 24 July.", "https://holywellscorkandkerry.com/2017/07/01/st-declans-well-ardmore/"], ["St Brigid's Well, Tully (Kildare)", "well", "en", 53.14391, -6.90241, "St Brigid's well near the ruined Black Abbey at Tully outside Kildare town, aptisms.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Cuthbert's Well, Edenhall", "well", "en", 54.68206, -2.67775, "Well by St Cuthbert's church at Edenhall, source of the legend of the 'Luck of Edenhall': fairies disturbed while drinking here are said to have left behind a medieval glass cup.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Helen's Well, Great Asby", "well", "en", 54.5138, -2.4931, "Holy well at Great Asby in a stone enclosure probably of the 19th century; a Grade II listed structure.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Michael's Well, Arthuret", "well", "en", 55.0005, -2.9723, "Well near St Michael's church at Arthuret, its structure probably dating from the 17th century.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Ninian's Well, Brisco", "well", "en", 54.8595, -2.9009, "Ancient well with a 19th-century wellhead restored by Sarah Losh; well and wellhead are Grade II listed.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Mungo's Well, Bromfield", "well", "en", 54.8122, -3.2836, "Medieval well near St Mungo's church, Bromfield, with a listed wellhead built in 1878.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Patrick's Well, Patterdale", "well", "en", 54.54112, -2.94807, "Roadside holy well by Ullswater linked to St Patrick, sheltered by an 18th-century well house; the original spring may have been slightly elsewhere.", "https://en.wikipedia.org/wiki/List_of_Holy_Wells_in_Cumbria"], ["St Guron's Well, Bodmin", "well", "en", 50.4714, -4.7171, "Probably 15th-century granite well head beside St Petroc's church, Bodmin, its roof imitating slate courses; a carved panel shows St Guron, said to have founded a hermitage here in the 5th century, kneeling at the well. Grade II*.", "https://historicengland.org.uk/listing/the-list/list-entry/1355184"], ["St Ruan's Well, Grade-Ruan", "well", "en", 49.988 const SINC_X={"1": {"cat": "lights", "place": "York", "lat": 53.95996, "lon": -1.08729, "approx": true, "summary": "A York man woken at 4am by a crash-like noise on his roof went outside and watched a silent, very bright white light that pulsed, seemed to approach, then sped away after about four minutes.", "tags": ["single-witness", "urban"]}, "2": {"cat": "lights", "place": "Above Flamborough Head, seen from Bridlington seafront", "lat": 54.1162, "lon": -0.0826, "approx": false, "summary": "A visitor walking back along Bridlington seafront saw a huge orange disc of light hanging above Flamborough Head beside a fishing boat's lights; it vanished within about three seconds.", "tags": ["single-witness", "coast", "sea"]}, "3": {"cat": "craft", "place": "A165 between Fraisthorpe and Wilsthorpe roundabout", "lat": 54.049, "lon": -0.219, "approx": false, "summary": "Two women driving the A165 saw an enormous silent object with two red lights pacing their car in the field beside the hedge; at Wilsthorpe roundabout it turned, climbed and sped out to sea.", "tags": ["multiple-witnesses", "road", "rural", "coast"]}, "4": {"cat": "craft", "place": "Above Ganstead, seen from Holderness Road (A165)", "lat": 53.785, "lon": -0.255, "approx": false, "summary": "A driver heading to Bilton saw a dark triangle, lit faintly from its far side, hanging or drifting silently over Ganstead in late 1998.", "tags": ["single-witness", "road"]}, "5": {"cat": "lights", "place": "Staxton, looking over the Carrs towards Oliver's Mount", "lat": 54.1985, "lon": -0.438, "approx": false, "summary": "Driving into Staxton around 1am, the witness saw a brilliant white circular object the size of a full moon hanging low over the fields.", "tags": ["single-witness", "road", "rural"]}, "6": {"cat": "lights", "place": "Flamborough Head car park by the Caravel bar", "lat": 54.1162, "lon": -0.0826, "approx": false, "summary": "A family parked at Flamborough Head in 1983 watched a football-sized orange light over the sea blink on and off for 40 minutes, apparently in time with the faulty flashing sign of the clifftop bar.", "tags": ["multiple-witnesses", "coast", "sea"]}, "7": {"cat": "other", "place": "Former RAF Bempton radar site, Bempton cliffs", "lat": 54.1338, "lon": -0.1785, "approx": false, "summary": "Paul Sinclair, out at night by the old Bempton bunker, saw a white light that vanished, a friend on the phone heard robotic voices, and a low hum surrounded the group for around 15 minutes.", "tags": ["multiple-witnesses", "paul-sinclair-witness", "military", "coast"]}, "8": {"cat": "lights", "place": "Off Flamborough Head", "lat": 54.1162, "lon": -0.0826, "approx": true, "summary": "A witness saw a series of repeatedly appearing lights off Flamborough Head, reported them to police as possible distress flares, and was told by the coastguard no military operation was under way.", "tags": ["single-witness", "police", "coast", "sea"]}, "9": {"cat": "craft", "place": "M62 eastbound just before junction 38 (North Cave)", "lat": 53.768, "lon": -0.685, "approx": false, "summary": "A driver saw a featureless polished metallic tic-tac shaped object, roughly bus-sized, hovering motionless in daylight near North Cave.", "tags": ["single-witness", "road"]}, "10": {"cat": "cryptid", "place": "Road from Flixton towards Muston", "lat": 54.203, "lon": -0.36, "approx": false, "summary": "Two women driving from Flixton had to brake for a hair-covered creature that crossed on all fours like a clumsy human, then leapt a long way into a field; they estimated it at 8ft standing.", "tags": ["multiple-witnesses", "road", "rural"]}, "11": {"cat": "lights", "place": "Bridlington Bay, Radio 270 pirate radio ship", "lat": 54.07, "lon": -0.15, "approx": true, "summary": "In summer 1966 a Radio 270 DJ described live on air a large luminous white sphere sitting above the ship's mast; a lightship off Spurn reportedly saw a similar sphere the same night.", "tags": ["multiple-witnesses", "sea", "coast"]}, "12": {"cat": "craft", "place": "Bowgie Inn car park, Crantock, Cornwall", "lat": 50.406, "lon": -5.121, "approx": false, "summary": "Over 100 people at a pub car park in 2009 watched large balls of light stream in from the sea and fields and merge into a stationary silent craft, which later left at great speed.", "tags": ["multiple-witnesses", "coast"]}, "13": {"cat": "lights", "place": "Farm at Staintondale", "lat": 54.356, "lon": -0.487, "approx": true, "summary": "At a farm barbecue around 1993 two people saw three lights travel in sync towards the sea, twist around each other, then race away over the water.", "tags": ["multiple-witnesses", "rural", "sea"]}, "14": {"cat": "lights", "place": "Ulrome beach, near the wind farm view", "lat": 53.997, "lon": -0.223, "approx": false, "summary": "An ex-trawlerman beach fishing at Ulrome saw dark red lights over the sea, then five hanging over Flamborough Head, which switched off together; he was sure they were not flares or aircraft.", "tags": ["single-witness", "coast", "sea"]}, "15": {"cat": "craft", "place": "A165 between Fraisthorpe and Wilsthorpe roundabout", "lat": 54.049, "lon": -0.219, "approx": false, "summary": "Two women saw a towering object with two red lights moving alongside their car in a roadside field, after a car ahead swerved; at the roundabout it rose and shot out to sea (closely matches report 3).", "tags": ["multiple-witnesses", "road", "coast"]}, "16": {"cat": "craft", "place": "Cornbrook Close, Wardle, Rochdale", "lat": 53.647, "lon": -2.132, "approx": false, "summary": "On a summer evening a man saw a small dark grey slant-sided craft with a yellow light drift silently at walking pace along a field edge; his friend's photos showed only a distant grey ball.", "tags": ["multiple-witnesses", "photo", "rural"]}, "17": {"cat": "lights", "place": "Tunnel Pits, Epworth lane near Wroot", "lat": 53.503, "lon": -0.85, "approx": true, "summary": "Driving home in 1988, a mother and son saw a vast funnel-shaped orange beam reaching the ground, with several red and green objects spiralling down around it; they fled in fear.", "tags": ["multiple-witnesses", "road", "rural"]}, "18": {"cat": "lights", "place": "Staxton, looking over the Carrs towards Oliver's Mount", "lat": 54.1985, "lon": -0.438, "approx": false, "summary": "The Staxton witness of report 5 adds that after seeing the moon-like white disc he was hit by sudden terror at home, then oddly forgot about it until next morning.", "tags": ["single-witness", "road", "rural"]}, "19": {"cat": "lights", "place": "Off Flamborough Head, seen from Bridlington Bay", "lat": 54.1162, "lon": -0.0826, "approx": false, "summary": "At 3.30am a witness watching through binoculars saw a row of 15 oval spheres of light over the sea off the headland, with a similar formation apparently on the cliffs; another observer watched for over half an hour.", "tags": ["multiple-witnesses", "sea", "coast"]}, "20": {"cat": "craft", "place": "Bessingby Hill / West Hill near Bridlington Hospital", "lat": 54.083, "lon": -0.212, "approx": false, "summary": "Two boys in 1966 hid as a seamless silver-blue wedge-shaped craft shimmering at its edges hung silently above the trees, clunked loudly, then jumped across the sky and vanished.", "tags": ["multiple-witnesses", "rural"]}, "21": {"cat": "ghost", "place": "Danes Dyke, Flamborough", "lat": 54.105, "lon": -0.143, "approx": false, "summary": "Youths at a night fire in Danes Dyke were watched by a silent figure well over 7ft tall that ignored shouts and banging; as they fled it leapt down into the dyke.", "tags": ["multiple-witnesses", "entity", "coast"]}, "22": {"cat": "cryptid", "place": "Denbigh Moors (Mynydd Hiraethog), near a stone circle", "lat": 53.1, "lon": -3.55, "approx": true, "summary": "A couple driving slowly across the remote Denbighshire moors around 2015 saw a grey cat the size of a springer spaniel run across the road.", "tags": ["multiple-witnesses", "moor", "road", "rural"]}, "23": {"cat": "lights", "place": "Filey Country Park, overlooking Filey Bay", "lat": 54.221, "lon": -0.283, "approx": false, "summary": "After a beach run, a man saw three dull orange lights switch on in a horizontal line over the middle of the bay, then go off together after two seconds.", "tags": ["single-witness", "coast", "sea"]}, "24": {"cat": "lights", "place": "Bessingby, looking towards Haisthorpe", "lat": 54.078, "lon": -0.224, "approx": false, "summary": "At 1am a Bessingby resident watched a silent cluster of sparkling red lights, like red diamonds, bob up and down before vanishing.", "tags": ["single-witness", "rural"]}, "25": {"cat": "craft", "place": "Northam clifftop, North Devon", "lat": 51.039, "lon": -4.216, "approx": false, "summary": "An MOD project manager and his wife watched seven fast orange-white lights over the coast; through binoculars one was a rotating bronze triangle. Later sightings included two round objects overhead and a 2016 light with apparent lost time.", "tags": ["multiple-witnesses", "military", "coast", "missing-time"]}, "26": {"cat": "cryptid", "place": "Holmes Gut, North Landing, Flamborough", "lat": 54.128, "lon": -0.105, "approx": false, "summary": "A couple at North Landing saw a huge dog-like animal sitting on a rock outcrop that no camera would record; it growled and slunk off on all fours.", "tags": ["multiple-witnesses", "coast", "entity"]}, "27": {"cat": "ghost", "place": "Hornsea beach by the sea wall", "lat": 53.911, "lon": -0.162, "approx": false, "summary": "A night angler saw a small thin all-black figure walking the shoreline that froze when noticed and pixelated away; he then appeared to lose around 80 minutes.", "tags": ["single-witness", "coast", "missing-time", "entity"]}, "28": {"cat": "lights", "place": "Bempton cliffs", "lat": 54.147, "lon": -0.167, "approx": false, "summary": "During documentary filming in February 2020, six observers including Paul Sinclair watched vivid orange spheres pop in and o e)", "lat": 54.135, "lon": -0.146, "approx": false, "summary": "A camper photographed lights moving at walking pace along Danes Dyke for over half an hour one August evening in 2019, watching until they went out.", "tags": ["single-witness", "photo", "coast", "rural"]}, "201": {"cat": "craft", "place": "West Hull, behind the witness's home", "lat": 53.753, "lon": -0.405, "approx": true, "summary": "An elderly woman heard a loud low drone and saw a large glittering gold light with tiny stub wings hover between houses behind her garden before shooting off east.", "tags": ["single-witness", "urban"]}, "202": {"cat": "lights", "place": "B1248 between Wharram le Street and the Towthorpe turn, looking towards York", "lat": 54.07, "lon": -0.665, "approx": false, "summary": "Driving home after midnight, a man photographed and filmed two gold lights drifting low over the western horizon towards Strensall; in January 2024 he saw a twinkling gold sphere hanging over York that vanished as he stopped.", "tags": ["single-witness", "photo", "video", "road", "rural"]}, "203": {"cat": "craft", "place": "Rear garden in Cardiff", "lat": 51.482, "lon": -3.179, "approx": true, "summary": "A Cardiff man filmed a bright silent object with what looked like four lights beneath moving east from the St Athan direction; earlier he had seen a flat disc with circling lights followed by military helicopters.", "tags": ["single-witness", "video", "military", "urban"]}, "204": {"cat": "lights", "place": "Viewing platform, Bempton Cliffs", "lat": 54.147, "lon": -0.167, "approx": false, "summary": "Paul Sinclair and two friends watched a large white sphere of light drift slowly low in the sky near the old RAF base, which he filmed for nearly three minutes before it vanished.", "tags": ["multiple-witnesses", "video", "coast", "paul-sinclair-witness"]}, "205": {"cat": "ghost", "place": "Gated lane near Ewden village, by Wharncliffe Crags", "lat": 53.46146, "lon": -1.59886, "approx": false, "summary": " ntly, before disappearing.", "tags": ["single-witness", "rural"]}, "213": {"cat": "lights", "place": "Bempton Cliffs, over the sea", "lat": 54.147, "lon": -0.167, "approx": false, "summary": "Paul Sinclair filmed lights apparently beneath the sea surface moving steadily out from the cliffs for over four minutes on a low-light camera.", "tags": ["multiple-witnesses", "video", "coast", "sea", "paul-sinclair-witness"]}, "214": {"cat": "timeslip", "place": "Cliff path between Bempton and Speeton", "lat": 54.155, "lon": -0.205, "approx": false, "summary": "A visitor walking the misty clifftop path took around 75 minutes to reach Speeton but only about 20 minutes to get back, feeling as if he had been transported.", "tags": ["single-witness", "missing-time", "coast", "rural"]}, "215": {"cat": "craft", "place": "Field by Danes Dyke near the old RAF Bempton site", "lat": 54.13, "lon": -0.155, "approx": false, "summary": "While talking with Paul Sinclair, a man saw a strange flat, almost two-dimensional object glide across a field and vanish where the coast path dips, apparently into the ground; Paul turned too late to see it.", "tags": ["single-witness", "coast", "rural"]}, "216": {"cat": "lights", "place": "Back garden in Letchworth, North Hertfordshire", "lat": 51.979, "lon": -0.229, "approx": true, "summary": "Over two evenings a woman watched several faint white lights cross the sky slowly one at a time, curve and wink out; her tracking app showed no satellites overhead.", "tags": ["single-witness", "urban"]}, "217": {"cat": "lights", "place": "Back door of a house in Weaverthorpe, Yorkshire Wolds", "lat": 54.1265, "lon": -0.5195, "approx": false, "summary": "A man saw a silent orange ring, bigger than the moon, rise vertically into cloud with a wavy line rotating across it; he also describes feeling watched in his paddock at night.", "tags": ["single-witness", "rural"]}, "218": {"cat": "craft", "place": "Southfield Well Balk, between The Spinney and the sewage works, Wetwang", "lat": 54.01, "lon": -0.578, "approx": false, "summary": "Walking his dog, a man saw a slow vase-shaped tube of light lying on its side with gold lights at each end and a transparent middle move north to south before dimming away.", "tags": ["single-witness", "rural", "road"]}, "219": {"cat": "lights", "place": "Woldgate, countryside on the edge of Bridlington", "lat": 54.074, "lon": -0.27, "approx": false, "summary": "On an evening drive, Paul Sinclair and his friend Bob saw one light and then two in the sky over Woldgate and both photographed them, without any explanation.", "tags": ["multiple-witnesses", "photo", "rural", "paul-sinclair-witness"]}, "220": {"cat": "craft", "place": "Cley Hill, near Warminster, Wiltshire", "lat": 51.2065, "lon": -2.237, "approx": true, "summary": "A woman recalls seeing a silver disc through a skylight with her father in 1976 before it shot upwards; her father, a regular Cley Hill skywatcher, came home once with an unexplained healed burn, and she later lost an hour during a sighting.", "tags": ["multiple-witnesses", "missing-time", "rural"]}, "221": {"cat": "craft", "place": "Fields between Bierley Woods and Bierley Lane, south Bradford", "lat": 53.766, "lon": -1.737, "approx": false, "summary": "In 1997 a man and his father walking the dog saw a dark silent triangle with white tip lights pass low overhead and descend towards Bradford city centre; further sightings followed.", "tags": ["multiple-witnesses", "urban"]}, "222": {"cat": "craft", "place": "Philips factory, Lightcliffe, Halifax", "lat": 53.72, "lon": -1.788, "approx": false, "summary": "In November 1977 three women getting off a bus saw a dark silent shape with reversed red and green lights and a huge flashing white light pass low over the factory; a colleague saw it near Bailiff Bridge.", "tags": ["multiple-witnesses", "urban"]}, "223": {"cat": "encounter", "place": "Field beside the road just south of the Ivychurch junction, Romney Marsh", "lat": 51.035, "lon": 0.865, "approx": false, "summary": "A driver saw a brilliant white tic-tac shaped object streak in from the sea and drop behind roadside trees, then glimpsed a grey craft with black markings hovering about 50ft above a field before it shot back out to sea.", "tags": ["single-witness", "road", "rural"]}, "224": {"cat": "other", "place": "Rendlesham Forest trail near Capel Green and the UFO model", "lat": 52.087, "lon": 1.44, "approx": false, "summary": "A regular visitor found two deer heads lying apart with no bodies or blood near the forest's UFO model, then felt an overwhelming fear of being followed all the way back to the car.", "tags": ["single-witness", "rural"]}, "225": {"cat": "lights", "place": "Rutland Street, Filey (also Filey Country Park facing the Brigg)", "lat": 54.211, "lon": -0.29, "approx": false, "summary": "A Filey teenager describes triangular craft over a play park, an orange orb zig-zagging seaward trailing sparks and apparently pursued by jets amid sudden silence, and later seven lights in formation off Filey Brigg.", "tags": ["single-witness", "coast", "sea", "military", "urban"]}, "226": {"cat": "cryptid", "place": "Neighbour's roof and cherry tree, Whitehaven, Cumbria", "lat": 54.549, "lon": -3.587, "approx": true, "summary": "Waking suddenly as a teenager, a man saw a huge silver-blue dog-headed creature crouched on a neighbour's roof which climbed down a tree and loomed at his window with glowing red eyes; he woke later unsure if it was a dream.", "tags": ["single-witness", "entity", "urban"]}, "227": {"cat": "lights", "place": "Southfield Well Balk, Wetwang, looking east over the sea", "lat": 54.01, "lon": -0.578, "approx": false, "summary": "A skywatcher on a dark lane saw a gold ball overhead, two gold sparking streaks low in the east and then lights flicking on and off far out over the North Sea, which Paul Sinclair also witnessed.", "tags": ["multiple-witnesses", "rural", "road", "paul-sinclair-witness"]}, "228": {"cat": "craft", "place": "North Morte Farm campsite, Mortehoe, Devon", "lat": 51.188, "lon": -4.203, "approx": false, "summary": "A couple at breakfast outside their campervan watched one or two bright silver triangles shining high over the sea through binoculars for some time.", "tags": ["multiple-witnesses", "coast", "sea"]}, "229": {"cat": "lights", "place": "Eston, Middlesbrough, looking over the Tees towards Teesport", "lat": 54.558, "lon": -1.145, "approx": false, "summary": "A taxi driver and his passenger saw three silent round objects each with a steady red glow follow the River Tees out to sea before splitting up over Teesport.", "tags": ["multiple-witnesses", "urban", "coast"]}, "230": {"cat": "lights", "place": "East side of Lakeside lake by the Travelodge, Doncaster", "lat": 53.505, "lon": -1.115, "approx": false, "summary": "A regular walker saw three silent orange balls in a triangle drift south over the lake, each outer light darting away and back to the formation in turn.", "tags": ["single-witness", "urban"]}, "231": {"cat": "lights", "place": "B1248 heading south from Wharram le Street", "lat": 54.082, "lon": -0.67, "approx": false, "summary": "Driving home, a man saw a very bright steady blue-white sphere race east to west beneath the cloud base for about five seconds.", "tags": ["single-witness", "road", "rural"]}, "232": {"cat": "lights", "place": "Anlaby Park, west Hull", "lat": 53.735, "lon": -0.395, "approx": false, "summary": "A Hull man photographed and filmed an elongated steady light crossing west to east, checking that neither space station was overhead.", "tags": ["single-witness", "photo", "video", "urban"]}, "233": {"cat": "lights", "place": "Portree harbour, Isle of Skye (with a second report from Dundee)", "lat": 57.412, "lon": -6.192, "approx": false, "summary": "An aurora photographer saw a bright orange light flare up and move slowly north before vanishing; a separate Dundee report describes a green flashing light that repeatedly stopped dead, ather than a typical anomaly.", "tags": ["multiple-witnesses", "video", "coast", "paul-sinclair-witness"]}, "242": {"cat": "other", "place": "Beach at Scarborough", "lat": 54.279, "lon": -0.399, "approx": true, "summary": "A holiday photo from Scarborough shows a silvery sphere sitting on the sea; Paul and Don suggest a fishing buoy or a stray beach ball as possible explanations.", "tags": ["photo", "coast", "sea"]}, "243": {"cat": "craft", "place": "Garden in Pannal, Harrogate", "lat": 53.958, "lon": -1.532, "approx": false, "summary": "Cutting hedges on a clear day, a man saw a silent chrome hourglass-shaped object of two joined teardrops pass quickly overhead from the Menwith Hill direction and photographed it as it left.", "tags": ["single-witness", "photo", "urban"]}, "244": {"cat": "craft", "place": "Garden in East Yorkshire", "lat": 53.95, "lon": -0.55, "approx": true, "summary": "A witness photographed a silent, wingless jet-black object moving west to east before it went into cloud; enlarging the image showed an apparent haze around it.", "tags": ["single-witness", "photo"]}, "245": {"cat": "lights", "place": "Clifftops at Bempton Cliffs", "lat": 54.147, "lon": -0.167, "approx": false, "summary": "Paul Sinclair and friends filmed unexplained lights from the cliffs which looked yellow to the eye but registered differently on camera.", "tags": ["multiple-witnesses", "video", "coast", "paul-sinclair-witness"]}, "246": {"cat": "craft", "place": "Sky over Newcastle upon Tyne", "lat": 54.978, "lon": -1.617, "approx": true, "summary": "At lunchtime a man saw two identical wingless metallic objects glinting in the sun as they moved slowly together across the sky.", "tags": ["single-witness", "urban"]}, "247": {"cat": "encounter", "place": "Paddock and field behind a house in the East Riding", "lat": 53.95, "lon": -0.6, "approx": true, "summary": "Out with his dog near midnight, a man saw a squat self-luminous silver-grey figure about 5ft tall drift across the next // ----- Road trip -----
function legMiles(a,b){return miles(a.lat,a.lon,b.lat,b.lon)}
function tourLen(start,pts,round){let d=0,prev=start;pts.forEach(p=>{d+=legMiles(prev,p);prev=p});if(round&&pts.length)d+=legMiles(prev,start);return d}
function optimise(start,pts,round){ // nearest neighbour then 2-opt
  let rest=[...pts],out=[],cur=start;while(rest.length){let bi=0,bd=Infinity;rest.forEach((p,i)=>{const d=legMiles(cur,p);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];out.push(cur)}
  let improved=true,guard=0;while(improved&&guard++<60){improved=false;for(let i=0;i<out.length-1;i++)for(let j=i+1;j<out.length;j++){const cand=[...out.slice(0,i),...out.slice(i,j+1).reverse(),...out.slice(j+1)];if(tourLen(start,cand,round)+1e-9<tourLen(start,out,round)){out=cand;improved=true}}}
  return out}
function autoPlan(){
  const pool=new Set();
  const keys=allKeys();
  keys.forEach(k=>{if(trip.pool.has("todo")&&isTodo(k))pool.add(k);if(trip.pool.has("star")&&isStar(k))pool.add(k)});
  if(trip.pool.has("sites"))sites.filter(s=>st.sacred.on.has(s.cat)).forEach(s=>pool.add(s.key));
  if(trip.pool.has("reports"))reports.filter(r=>st.paranormal.on.has(r.cat)).forEach(r=>pool.add(r.key));
  if(trip.pool.has("sinclair"))sinc.filter(r=>!r.approx).forEach(r=>pool.add(r.key));
  let cand=[...pool].map(itemOf).filter(Boolean).filter(it=>(!trip.skipVis||!isVis(it.key))&&legMiles(trip.start,it)<=trip.radius);
  // prefer marked items, then nearest
  cand.forEach(it=>{it._score=legMiles(trip.start,it)*(isStar(it.key)?0.55:1)*(isTodo(it.key)?0.55:1)});
  cand.sort((a,b)=>a._score-b._score);
  const chosen=[];cand.forEach(it=>{if(chosen.length<trip.max&&!chosen.some(c=>legMiles(c,it)<0.15))chosen.push(it)});
  trip.stops=optimise(trip.start,chosen,trip.round).map(i=>i.key);
  return cand.length}
function fitTrip(){const its=trip.stops.map(itemOf).filter(Boolean);fitPoints([P(trip.start.lat,trip.start.lon),...its.map(i=>i.xy)]);scrollToMap()}
function gmapsLinks(){const its=trip.stops.map(itemOf).filter(Boolean);if(!its.length)return[];
  const pts=[trip.start,...its,...(trip.round?[trip.start]:[])];const links=[];
  for(let i=0;i<pts.length-1;i+=10){const seg=pts.slice(i,i+11);if(seg.length<2)break;const o=seg[0],d=seg[seg.length-1],w=seg.slice(1,-1);
    links.push(`https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=${o.lat},${o.lon}&destination=${d.lat},${d.lon}${w.length?"&waypoints="+w.map(p=>p.lat+","+p.lon).join("%7C"):""}`)}
  return links}
const fmtTime=m=>{const h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h}h ${mm}m`:`${mm}m`};
function renderTrip(){
  $("chips").innerHTML="";leyChip();$("tagrow").innerHTML="";$("opt1").innerHTML="";syncFilterBar([]);drawLeys(true);
  const marked=allKeys().filter(k=>isStar(k)||isTodo(k)).length;

  return ev.filter(e=>e.d>=new Date(from.getTime()-864e5/2)&&e.d<=to).sort((a,b)=>a.d-b.d)}
const daysTo=d=>Math.round((d-new Date())/864e5);
function drawSky(){const g=RG;alignedSites().forEach(a=>{if(a.ev==="lunar")return;const y=new Date().getUTCFullYear();const s=seasons(y);const when=fromJ(s[a.ev]);const t=sunTimes(when,a.s.lat,a.s.lon);if(!t)return;
  const az=a.what==="sunrise"?t.riseAz:t.setAz;const d=20;const la=a.s.lat+d*Math.cos(rad(az))/69,lo=a.s.lon+d*Math.sin(rad(az))/(69*Math.cos(rad(a.s.lat)));
  const p0=a.s.xy,p1=P(la,lo);el("line",{x1:p0[0],y1:p0[1],x2:p1[0],y2:p1[1],stroke:a.ev==="jun"?"var(--l0)":"var(--l3)","stroke-width":2.5,"vector-effect":"non-scaling-stroke","stroke-dasharray":"8 4"},g)})}
function renderSky(){
  $("chips").innerHTML="";$("tagrow").innerHTML="";$("opt1").innerHTML="";syncFilterBar([]);
  const saveKinds=new Set(st.sacred.kinds);st.sacred.kinds=new Set(["astro","major"]);const old=F.showLeysOther;F.showLeysOther=true;drawLeys();F.showLeysOther=old;st.sacred.kinds=saveKinds;
  drawSky();
  const now=new Date();const as=alignedSites();
  as.forEach(a=>{const m=mk("s-"+a.s.cat,a.s.xy,a.s.name,()=>select({kind:"site",id:a.s.id},false),{key:a.s.key});markClasses(m.u,a.s.key);markers.push(m)});
  // this weekend
  const sat=new Date(now);sat.setDate(now.getDate()+((6-now.getDay()+7)%7));const sun=new Date(sat);sun.setDate(sat.getDate()+1);
  const ill=Math.round(moonIllum(sat)*100),st0=sunTimes(sat,HOME.lat,HOME.lon);
  const wk=skyEvents(new Date(sat.getTime()-2*864e5),4).filter(e=>e.kind!=="new"&&e.kind!=="full");
  const box=document.createElement("div");box.className="trip";
  box.innerHTML=`<div><b>This weekend</b> <span class="meta">${fmtD(sat)} – ${fmtD(sun)}</span></div>
   <div class="tripsum"><span><b>${moonPhaseName(sat)}</b> ${ill}% lit</span><span>Sunrise <b>${fmtT(st0?.rise)}</b></span><span>Sunset <b>${fmtT(st0?.set)}</b></span></div>
   <div class="meta">${ill<=25?"Dark skies this weekend: good for sky-watching, light reports and the meteor showers.":ill>=85?"A bright moon this weekend: good for night walks to the stones, poor for faint lights.":"A part-lit moon this weekend."}${wk.length?" Also on: "+wk.map(e=>esc(e.name)).join(", ")+".":""} Times are for Mold.</div>`;
  $("intro").innerHTML="";$("formbox").innerHTML="";$("intro").appendChild(box);
  // aligned sites
  section("Sites aligned to the sun and moon",as.map(a=>{let when="",d=null;if(a.ev!=="lunar"){const y=now.getUTCFullYear();d=fromJ(seasons(y)[a.ev]);if(d<now)d=fromJ(seasons(y+1)[a.ev]);const t=sunTimes(d,a.s.lat,a.s.lon);when=`${fmtD(d)} · ${a.what} ${fmtT(a.what==="sunrise"?t?.rise:t?.set)} · in ${daysTo(d)} days`}else when="Next major lunar standstill around 2043";
    return row(icon("s-"+a.s.cat),a.s.name+" · "+(a.ev==="jun"?"midsummer ":a.ev==="dec"?"midwinter ":"")+a.what,"",when+" · "+a.note,isSel("site",a.s.id),()=>select({kind:"site",id:a.s.id},true),"",a.s.key)}));
  const astro=leys.filter(l=>l.kind==="astro");
  section("Astronomical alignments",astro.map(l=>row(leyIcon(l),l.name,Math.round(l.mi)+" mi",l.desc,isSel("ley",l.id),()=>select({kind:"ley",id:l.id},true))));
  // calendar
  const ev=skyEvents(now,370);const sym={sun:"☀",fire:"✦",meteor:"☄",new:"●",full:"○"};
  const list=$("list");const h=document.createElement("h2");h.textContent="The next twelve months · "+ev.length;list.appendChild(h);const ol=document.createElement("ol");
  ev.forEach(e=>{const li=document.createElement("li");li.className="stop";const dd=daysTo(e.d);
    const sites_=e.kind==="sun"?as.filter(a=>a.ev===e.key):[];const t=e.kind==="sun"?sunTimes(e.d,HOME.lat,HOME.lon):null;
    li.innerHTML=`<span class="n" style="background:${e.kind==="sun"?"var(--l0)":e.kind==="fire"?"var(--l6)":e.kind==="meteor"?"var(--l3)":"var(--muted)"}">${sym[e.kind]}</span><span class="nm"></span><span class="meta">${dd<=0?"today":dd===1?"tomorrow":"in "+dd+" days"}</span><span class="ds"></span>`;
    li.querySelector(".nm").textContent=e.name;
    li.querySelector(".ds").textContent=`${fmtD(e.d)} · ${e.sub}${t?` · Mold sunrise ${fmtT(t.rise)}, sunset ${fmtT(t.set)}`:""}${sites_.length?" · Go to: "+sites_.map(a=>a.s.name).join(", "):""}`;
    if(sites_.length){li.querySelector(".nm").style.cursor="pointer";li.querySelector(".nm").onclick=()=>fitPoints(sites_.map(a=>a.s.xy))}
    ol.appendChild(li)});list.appendChild(ol);
  $("count").textContent="";
}

// ---------- selection ----------
function select(s,fly){sel=s;render();
  if(s.kind==="site"){const x=sites[s.id];siteCard(x);if(fly)flyTo(x.xy,140)}
  else if(s.kind==="ley"){const l=leyOf(s.id);leyCard(l);if(fly){fitPoints(l.path);scrollToMap()}}
  else if(s.kind==="sinc"){const r=sincById.get(s.id);sincCard(r);if(fly)flyTo(r.xy,30)}
  else if(s.kind==="rep"){const r=reports.find(x=>x.id===s.id);if(r){repCard(r);if(fly)flyTo(r.xy,60)}}}

window.addEventListener("resize",applyVB);
setTab(location.hash.slice(1)||"sacred");

(async()=>{
  try{
    db=await claude.use("db");
    if(!db){dbState="none";if(["paranormal","mu","ritual"].includes(tab))render();return}
    user=await claude.use("user");
    if(user){try{myId=await user.id()}catch(e){}let w=null;try{w=await user.can("data.write")}catch(e){}canWrite=w!==false}else canWrite=true;
    try{assetsApi=await claude.use("assets")}catch(e){assetsApi=null}
    if(myId){try{marksRef=db.collection("data/users/"+myId).doc("marks");const snap=await marksRef.get();
      if(snap.exists){const v=snap.data()||{};const rm=v.m&&typeof v.m==="object"?v.m:{};marks.m={...marks.m,...rm};
        const tr=Array.isArray(v.trips)?v.trips:[];const names=new Set(tr.map(t=>t.name));marks.trips=[...tr,...marks.trips.filter(t=>!names.has(t.name))].slice(0,30)}
      saveMarks();render()}catch(e){marksRef=null}}
    db.collection("reports").onSnapshot(snap=>{
      reports=snap.docs.map(d=>normReport(d.id,d.data()||{})).filter(r=>isFinite(r.lat)&&isFinite(r.lon));
      dbState="ready";
      if(!formOpen)render();
      if(sel&&sel.kind==="rep"){const r=reports.find(x=>x.id===sel.id);if(r)repCard(r);else closeCard()}
    },()=>{dbState="error";if(["paranormal","mu","ritual"].includes(tab))render()});
  }catch(e){dbState="none";if(["paranormal","mu","ritual"].includes(tab))render()}
})();
