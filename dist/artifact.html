<title>Sacred Missions Map</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: OS-antiquity-map feel — survey sheet left, gazetteer right; three tabs share one map */
:root{
  --bg:#e9ede6; --panel:#f6f8f3; --ink:#1d2622; --muted:#5d6b63; --line:#c9d1c8;
  --sea:#d3e0e2; --land:#f3f1e4; --land-edge:#8c9a8e; --ie:#e6e8de;
  --well:#2f63b8; --falls:#0f8a95; --stone:#8a5a1c; --lore:#7a3f8f; --spring:#2f7d3b; --home:#b3261e; --cave:#4a5263; --fort:#6b7a1f; --ley:#b8860b;
  --p-lights:#d9730d; --p-craft:#1f6f8b; --p-encounter:#c2185b; --p-ghost:#6f62a8; --p-poltergeist:#8e3fa8; --p-cryptid:#5b7a1f; --p-timeslip:#a87a08; --p-ritual:#7a1f2e; --p-mu:#0b6e69; --p-other:#6b6b6b;
  --danger:#b3261e;
  --l0:#b8860b; --l1:#c0392b; --l2:#2e7d32; --l3:#1565c0; --l4:#8e24aa; --l5:#00838f; --l6:#d84315; --l7:#6d4c41; --l8:#ad1457; --l9:#558b2f; --l10:#283593; --l11:#00695c;
  --display:"IM Fell English","Iowan Old Style",Georgia,serif;
  --sc:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --panel:#19211e; --ink:#e3e8e2; --muted:#93a39a; --line:#2c3833;
  --sea:#0e1a1d; --land:#24302a; --land-edge:#4d5f55; --ie:#1c2622;
  --well:#7ea8f0; --falls:#4fc7cf; --stone:#d6a55e; --lore:#c391d6; --spring:#7cc58a; --home:#ff7a6e; --cave:#aab4c8; --fort:#b7c66a; --ley:#e8c060;
  --p-lights:#ffa24d; --p-craft:#5cc3e6; --p-encounter:#ff6fa6; --p-ghost:#b3a8f0; --p-poltergeist:#d38bf0; --p-cryptid:#a7c95a; --p-timeslip:#e8c35a; --p-ritual:#e2727f; --p-mu:#3fc7bd; --p-other:#a8a8a8;
  --danger:#ff7a6e; --l0:#e8c060; --l1:#ff7a6e; --l2:#7cc58a; --l3:#7ea8f0; --l4:#d38bf0; --l5:#4fc7cf; --l6:#ffa24d; --l7:#c8a080; --l8:#ff7fb0; --l9:#b7c66a; --l10:#9fa8ff; --l11:#5fd3c0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --panel:#19211e; --ink:#e3e8e2; --muted:#93a39a; --line:#2c3833;
  --sea:#0e1a1d; --land:#24302a; --land-edge:#4d5f55; --ie:#1c2622;
  --well:#7ea8f0; --falls:#4fc7cf; --stone:#d6a55e; --lore:#c391d6; --spring:#7cc58a; --home:#ff7a6e; --cave:#aab4c8; --fort:#b7c66a; --ley:#e8c060;
  --p-lights:#ffa24d; --p-craft:#5cc3e6; --p-encounter:#ff6fa6; --p-ghost:#b3a8f0; --p-poltergeist:#d38bf0; --p-cryptid:#a7c95a; --p-timeslip:#e8c35a; --p-ritual:#e2727f; --p-mu:#3fc7bd; --p-other:#a8a8a8;
  --danger:#ff7a6e; --l0:#e8c060; --l1:#ff7a6e; --l2:#7cc58a; --l3:#7ea8f0; --l4:#d38bf0; --l5:#4fc7cf; --l6:#ffa24d; --l7:#c8a080; --l8:#ff7fb0; --l9:#b7c66a; --l10:#9fa8ff; --l11:#5fd3c0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0;max-width:56ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{font-family:var(--sc);font-size:17px;letter-spacing:.06em;color:var(--muted);text-decoration:none;padding:8px 14px 9px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--sea);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (max-width:860px){.mapbox{position:relative;top:0}}
svg#map{display:block;width:100%;height:min(78vh,760px);touch-action:none;cursor:grab}
@media (max-width:860px){svg#map{height:62vh}}
svg#map.drag{cursor:grabbing}
svg#map.picking{cursor:crosshair}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;vector-effect:non-scaling-stroke}
.ie{fill:var(--ie);stroke:var(--land-edge);stroke-width:.5;vector-effect:non-scaling-stroke}
.graticule{stroke:var(--land-edge);stroke-opacity:.25;stroke-width:.5;vector-effect:non-scaling-stroke;fill:none;stroke-dasharray:2 4}
.mk{cursor:pointer}
.sh{stroke:var(--ring,var(--panel));stroke-width:var(--rw,1.2px);vector-effect:non-scaling-stroke}
.mk.starred{--ring:var(--l0);--rw:2.6px}
.mk.todo{--ring:var(--l3);--rw:2.6px}
.mk.starred.todo{--ring:var(--l0)}
.mk.tripstop{--ring:var(--danger);--rw:2.4px}
.routeline{stroke:var(--danger);stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.routeret{stroke-dasharray:6 6;opacity:.5}
.stopnum{font-family:var(--body);font-weight:700;fill:var(--panel);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.stopbg{fill:var(--danger)}
.mk.sel .sh{stroke:var(--ink);stroke-width:2.2}
.mk.visited .sh{opacity:.45}
.reglabel{font-family:var(--sc);fill:var(--muted);opacity:.7;letter-spacing:.12em;pointer-events:none}
.leyaxis{stroke:var(--c,var(--ley));stroke-opacity:.45;stroke-width:1;stroke-dasharray:3 5;vector-effect:non-scaling-stroke;pointer-events:none}
.leyline{stroke:var(--c,var(--ley));fill:none;stroke-width:2.5;stroke-dasharray:7 5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.leyline.sel{stroke-width:4.5;stroke-dasharray:none}
.leyhit{stroke:transparent;stroke-width:18;fill:none;vector-effect:non-scaling-stroke;cursor:pointer}
.leystop{cursor:pointer;color:var(--c,var(--ley))}
.leyg.dim{opacity:.18}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.filters select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.filters .on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:4px 2px}
.tagrow{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.taghead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.taggroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.taggroup .tgl{font-family:var(--sc);letter-spacing:.05em;color:var(--muted);font-size:13px;min-width:100%;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--panel);color:var(--muted);border:0;padding:3px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tg{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:4px;padding:3px 8px;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tg b{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.count{font-size:13px;color:var(--muted);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c);vertical-align:middle}
.tagsel{display:flex;flex-wrap:wrap;gap:6px}
.marks{display:inline-flex;gap:4px;flex-wrap:wrap}
.mkb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.mkb[aria-pressed="true"].star{background:var(--l0);border-color:var(--l0);color:#1d1a10}
.mkb[aria-pressed="true"].todo{background:var(--l3);border-color:var(--l3);color:#fff}
.mkb[aria-pressed="true"].vis{background:var(--l2);border-color:var(--l2);color:#fff}
.flags{font-size:12px;letter-spacing:.04em;white-space:nowrap}
.flags .fs{color:var(--l0)} .flags .ft{color:var(--l3)} .flags .fv{color:var(--l2)}
.srcs{margin:0 0 8px;padding-left:18px;font-size:13px;color:var(--muted)}
.srcs a{color:var(--ink)}
.trip{display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.trip .row2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.trip select,.trip input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.trip label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.tripsum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;font-variant-numeric:tabular-nums}
.tripsum b{font-size:20px;font-family:var(--display);font-weight:400;color:var(--ink)}
li.stop{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:8px 6px;border-bottom:1px dotted var(--line)}
li.stop .n{width:24px;height:24px;border-radius:50%;background:var(--danger);color:var(--panel);font-weight:700;font-size:13px;display:grid;place-items:center}
li.stop .nm{font-family:var(--display);font-size:17px;line-height:1.2;cursor:pointer}
li.stop .ds{grid-column:2/4;font-size:13px;color:var(--muted)}
li.stop .ctl{display:flex;gap:2px}
 .visit{display:grid;gap:6px;margin-top:10px}
.visit textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:64px;resize:vertical;width:100%}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.photos figure{position:relative;margin:0}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block}
.phx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;line-height:1}
.phadd{cursor:pointer}
li.stop .ctl button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;width:28px;height:28px;cursor:pointer}
.leytag{font-family:var(--sc);fill:var(--c,var(--ley));letter-spacing:.06em;pointer-events:none;paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
.ctrls{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctrls button,.reg button,.chip,.btn{font:inherit}
.ctrls button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.reg{position:absolute;left:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 70px)}
.reg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.reg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.scale{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale i{display:block;height:5px;border:1px solid var(--muted);border-top:0;margin-top:2px}
.pickbar{position:absolute;left:10px;right:10px;top:54px;background:var(--ink);color:var(--panel);border-radius:6px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pickbar button{background:none;border:1px solid var(--panel);color:var(--panel);border-radius:4px;padding:3px 9px;font:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--well);outline-offset:2px}
.card{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:70%;overflow:auto}
.card h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 28px 2px 0;line-height:1.15}
.card p{margin:6px 0 10px;font-size:15px}
.card .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:14px;color:var(--ink);background:var(--bg);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.stops{margin:6px 0 10px;padding:0;list-style:none;max-height:28vh;overflow:auto;font-size:14px}
.stops li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--line)}
.stops a{color:var(--ink)}
.tag{display:inline-block;margin:0 6px 8px 0;font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--ley) 22%,transparent);border-radius:4px;padding:2px 7px}
.side{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px 6px 9px;font-size:14px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45;background:transparent}
.chip svg{width:16px;height:16px;flex:none}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px;color:var(--muted)}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tools input[type=search]{flex:1 1 180px;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
h2{font-family:var(--sc);font-weight:400;font-size:15px;letter-spacing:.14em;color:var(--muted);margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
ol{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:8px 6px;border-radius:6px;cursor:pointer}
li.row:hover,li.row.sel{background:var(--panel)}
li.row svg{width:18px;height:18px;margin-top:3px}
li.row .nm{font-family:var(--display);font-size:18px;line-height:1.2}
li.row .ds{grid-column:2/4;font-size:14px;color:var(--muted)}
li.row .mi{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
li.row.visited .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.note{margin-top:22px;font-size:13px;color:var(--muted);max-width:62ch}
.intro{font-size:15px;margin:0 0 12px;max-width:62ch}
.intro a{color:var(--ink)}
form.add{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
form.add label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
form.add input,form.add select,form.add textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
form.add textarea{min-height:80px;resize:vertical}
form.add .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){form.add .two{grid-template-columns:1fr}}
.err{color:var(--danger);font-size:14px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.srcs.mu li{margin-bottom:4px}.srcs.mu details{margin:2px 0 4px}.srcs.mu summary{cursor:pointer;color:var(--muted);font-size:.85em}.mu-ex{font-size:.86em;margin:4px 0 0;line-height:1.45}.mu-links{display:block;margin-top:3px}.mu-plus{font-size:.72em;border:1px solid currentColor;border-radius:8px;padding:0 5px;opacity:.75}.mu-date{opacity:.65;font-size:.85em}
</style>

tone.", "stops": [["Rudston B cursus SW terminal", 54.08715, -0.34804], ["Rudston B cursus NE end", 54.09227, -0.32796], ["Rudston Monolith", 54.09388, -0.32257]], "url": "https://www.thenorthernantiquarian.org/2011/03/12/rudston-b/", "region": "Yorkshire & North East"}, {"id": "almscliffe-solstice", "name": "Almscliffe Solstice Line", "who": "Paul Bennett, The Northern Antiquarian (2017)", "kind": "astro", "desc": "A natural solstice line between Little Almscliffe and Almscliffe Crag: winter sunrise seen from the smaller crag, summer sunset from the greater. The lost Staniston Hill standing stone is said to sit near its midpoint.", "stops": [["Little Alms Cliff", 53.96603, -1.6473], ["Staniston Hill stone (lost)", 53.94644, -1.61717], ["Almscliffe Crag", 53.93654, -1.59298]], "url": "https://www.thenorthernantiquarian.org/2017/01/12/staniston-hill/", "region": "Yorkshire & North East"}, {"id": "kilmartin-dun-chonallaich", "name": "Kilmartin Cairns–Dun Chonallaich", "who": "Paul Bennett, The Northern Antiquarian (2008)", "kind": "ley", "desc": "The Bronze Age linear cemetery of five cairns along Kilmartin Glen runs roughly north–south. Bennett argues its line was deliberately aimed at the hill of Dun Chonallaich about three miles to the north.", "stops": [["Ri Cruin Cairn", 56.11714, -5.4995], ["Nether Largie South Cairn", 56.12456, -5.4951], ["Nether Largie Mid Cairn", 56.12804, -5.49258], ["Nether Largie North Cairn", 56.1295, -5.49179], ["Glebe Cairn", 56.13382, -5.48887], ["Dun Chonallaich", 56.17681, -5.45793]], "url": "https://www.thenorthernantiquarian.org/2008/10/03/dun-chonallaich/", "region": "Scotland"}, {"id": "brodgar-watchstone-barnhouse", "name": "Brodgar–Watchstone–Barnhouse Line", "who": "Magnus Spence (1893, 1905); Sir Norman Lockyer (1906)", "kind": "astro", "desc": "Spence proposed that the centre of the Ring of Brodgar, the Watchstone and the Barnhouse Stone form one line marking calendar sunrises and sunsets. Lockyer kept the line but tied it to Beltane sunset and Hallowmas sunrise.", "stops": [["Ring of Brodgar", 59.00148, -3.22972], ["Watch Stone", 58.99521, -3.21036], ["Barnhouse Stone", 58.99113, -3.19751]], "url": "https://www.nessofbrodgar.co.uk/watching-the-watchstone/", "region": "Scotland"}, {"id": "maeshowe-barnhouse", "name": "Maeshowe–Barnhouse Stone Line", "who": "Magnus Spence (1893)", "kind": "astro", "desc": "Maeshowe's entrance passage lines up with the Barnhouse Stone about 750 m south-west. Looking out, the line marks sunset about ten days before the winter solstice; looking the other way, midsummer sunrise.", "stops": [["Maeshowe", 58.9966, -3.1882], ["Barnhouse Stone", 58.99113, -3.19751]], "url": "https://www.nessofbrodgar.co.uk/barnhouse-stone", "region": "Scotland"}, {"id": "stenness-brodgar-avenue", "name": "Stenness–Watchstone–Brodgar Avenue", "who": "Daniel Wilson (1851); James Macbeath (1892)", "kind": "ley", "desc": "Early antiquarians proposed a stone-lined avenue joining the Stones of Stenness to the Ring of Brodgar, with the Watchstone as its last surviving stone. Geophysics has since found no trace of such a route.", "stops": [["Stones of Stenness", 58.99402, -3.20805], ["Watch Stone", 58.99521, -3.21036], ["Ring of Brodgar", 59.00148, -3.22972]], "url": "https://www.nessofbrodgar.co.uk/watching-the-watchstone/", "region": "Scotland"}, {"id": "callanish-standstill", "name": "Callanish Lunar Standstill", "who": "Popular theory; observations by Margaret Curtis and Gerald Ponting", "kind": "astro", "desc": "At the major lunar standstill, the moon is said to skim the 'Sleeping Beauty' hills, set towards Glen Langadale in Harris, then briefly reappear among the Callanish stones. Some read this as a deliberate ceremonial design.", "stops": [["Callanish Stones", 58.19754, -6.74514], ["Glen Langadale (moonset)", 58.00649, -6.83134]], "url": "https://ynysprydein.org/tag/moon/", "region": "Scotland"}, {"id": "lundin-links-lunar", "name": "Lundin Links Lunar Line", "who": "Alexander Thom (1971); disputed by Douglas Heggie (1981)", "kind": "astro", "desc": "Thom argued that the tall Lundin stones mark the minor-standstill moon setting on Cormie Hill, while the same moon rises grazing the Bass Rock across the Forth.", "stops": [["Cormie Hill (moonset)", 56.1141, -3.20814], ["Standing Stones of Lundin", 56.21337, -2.96113], ["Bass Rock (moonrise)", 56.07747, -2.64057]], "url": "https://www.thenorthernantiquarian.org/2013/06/26/lundin-links/", "region": "Scotland"}, {"id": "gleneagles-white-stone", "name": "Gleneagles–Boat Stone–White Stone", "who": "Andrew Finlayson, The Stones of Strathearn (2010)", "kind": "ley", "desc": "A south-westerly alignment of Strathearn standing stones, from the Gleneagles pair through the fallen Boat Stone to the White Stone near Dunblane. It holds on a 1:50,000 map but misses by 20–30 yards at larger scales.", "stops": [["Gleneagles 'A' stone", 56.26681, -3.74348], ["Boat Stone", 56.24467, -3.82176], ["White Stone, Dunblane", 56.21539, -3.92641]], "url": "https://www.thenorthernantiquarian.org/2012/07/27/gleneagles-a/", "region": "Scotland"}, {"id": "twmbarlwm-pleiades", "name": "Twmbarlwm Pleiades Line", "who": "Harry Sivertsen, Megalithic Portal (2011)", "kind": "astro", "desc": "Sivertsen proposed a line from the Twmbarlwm cairns to the western cairn on Gray Hill, continuing to a short solar stone row, which he dated to about 2500 BC via the rising Pleiades.", "stops": [["Twmbarlwm", 51.62722, -3.09639], ["Gray Hill (western cairn)", 51.63773, -2.81786], ["Gray Hill stone circle", 51.63764, -2.81335]], "url": "https://www.megalithic.co.uk/Pleiades-alignments-in-Wales-Archaoastronomy-at-Twmbarlwm-Parts-2-and-3-2146414010", "region": "Wales"}, {"id": "twmbarlwm-druidstone", "name": "Twmbarlwm–Druidstone–Flat Holm", "who": "Harry Sivertsen, Megalithic Portal (2011)", "kind": "ley", "desc": "A line from the northernmost Twmbarlwm cairn, past its other two cairns, south to the middle of Flat Holm. On the way it meets the Druidstone standing stone at St Mellons, which Sivertsen said 'begs the question of intention'.", "stops": [["Twmbarlwm", 51.62722, -3.09639], ["Druidstone, St Mellons", 51.54455, -3.09576], ["Flat Holm", 51.37762, -3.12062]], "url": "https://www.megalithic.co.uk/Pleiades-alignments-in-Wales-Archaoastronomy-at-Twmbarlwm-Parts-2-and-3-2146414010", "region": "Wales"}, {"id": "parc-y-meirw-leinster", "name": "Parc-y-Meirw–Mount Leinster", "who": "Alexander Thom (Thom, Thom & Burl 1990)", "kind": "astro", "desc": "Thom suggested the Parc-y-Meirw stone row in Pembrokeshire points WNW to a minor northern moonset over Mount Leinster in Ireland, about 91 miles across the Irish Sea. Burl doubted it.", "stops": [["Parc-y-Meirw stone row", 51.98551, -4.9156], ["Mount Leinster", 52.61816, -6.78034]], "url": "https://www.thenorthernantiquarian.org/2010/11/01/parc-y-meirw/", "region": "Wales"}, {"id": "boscawen-un-a1", "name": "Boscawen-Un–Perranuthnoe Ley", "who": "John Michell, The Ley Hunter (1970), from a Lockyer bearing", "kind": "ley", "desc": "Michell's line A1 runs from the Boscawen-Un circle through a stone cross and the Tresvennack pillar, and may extend to St Piran's church at Perranuthnoe.", "stops": [["Boscawen-Un stone circle", 50.09021, -5.61958], ["Tresvennack Pillar", 50.09779, -5.57546], ["Perranuthnoe church", 50.11486, -5.44584]], "url": "https://megalithia.com/alternative/leycornwall.html", "region": "South West"}, {"id": "tregeseal-chysauster", "name": "Tregeseal–Lanyon–Chysauster Ley", "who": "John Michell, The Ley Hunter (1970)", "kind": "ley", "desc": "Michell's line B1(c) links the Tregeseal circle with Lanyon Quoit, a standing stone, and the Chysauster courtyard-house village, one of several West Penwith alignments he plotted.", "stops": [["Tregeseal stone circle", 50.13446, -5.65854], ["Lanyon Quoit", 50.1475, -5.59917], ["Standing stone SW440340", 50.15118, -5.58421], ["Chysauster village", 50.16103, -5.54022]], "url": "https://megalithia.com/alternative/leycornwall.html", "region": "South West"}, {"id": "rollright-salford", "name": "King Stone–Salford Cross Ley", "who": "Local ley tradition, recorded in The Northern Antiquarian (2010)", "kind": "ley", "desc": "A ley said to run from the King Stone through the Rollright circle and Little Rollright church, where a standing stone is set in the walling, to the Salford cross-base and a lost cross beyond.", "stops": [["King Stone", 51.97625, -1.57016], ["Rollright Stones", 51.97555, -1.5708], ["Little Rollright church", 51.96884, -1.57422], ["Salford Cross", 51.95028, -1.58464]], "url": "https://www.thenorthernantiquarian.org/2010/08/30/salford-cupmarks/", "region": "South East"}, {"id": "bincknoll-marden", "name": "Bincknoll–Beckhampton–Marden Ley", "who": "Devereux & Thomson, The Ley Hunter's Companion (1979)", "kind": "ley", "desc": "A roughly 13-mile north–south ley across the Avebury landscape, from Bincknoll Castle through the Beckhampton Penning earthwork to Marden Henge in the Vale of Pewsey.", "stops": [["Bincknoll Castle", 51.51199, -1.84586], ["Beckhampton Penning", 51.40738, -1.86822], ["Marden Henge", 51.32489, -1.86954]], "url": "https://www.thenorthernantiquarian.org/2011/03/06/beckhampton-penning/", "region": "South West"}, {"id": "wilmington-ley", "name": "Wilmington Ley", "who": "Devereux & Thomson, The Ley Hunter's Companion (1979)", "kind": "ley", "desc": "A short Sussex ley from Wilmington church past the priory to the Long Man hill figure and the barrow on Windover Hill, ending in Friston Forest.", "stops": [["Wilmington church", 50.81748, 0.19065], ["Wilmington Priory", 50.81754, 0.19025], ["Long Man of Wilmington", 50.81, 0.188], ["Windover Hill barrow", 50.80844, 0.18737]], "url": "https://orbific.com/?p=2411", "region": "South East"}];
const SITES_X=[["Llyn Brianne", "lore", "wa", 52.1295, -3.755, "Remote reservoir in the upper Tywi valley behind the tallest dam in the UK (91 m). Farms were drowned when it was built in the early 1970s, and Fannog farmhouse's roof shows when the water is low. The spillway roars after heavy rain.", "https://en.wikipedia.org/wiki/Llyn_Brianne"], ["Twm Siôn Cati's Cave", "cave", "wa", 52.1056, -3.7613, "Hideout of the 'Welsh Robin Hood', Thomas Jones (c.1530–1609), on the wooded hill of the RSPB Gwenffrwd-Dinas reserve near Rhandirmwyn, just south of Llyn Brianne. Reached by the reserve's riverside trail and a scramble up the boulders. Position approximate.", "https://rhandirmwyn.net/twmsioncati.html"], ["Ffynnon Beuno, Pen Dre (Holywell)", "well", "wa", 53.27639, -3.22504, "A minor spring and pool in Holywell attributed to St Beuno, uncle of St Winefride; the Royal Commission noted only a slight spring here in 1912.", "https://coflein.gov.uk/en/site/32307"], ["Ffynnon Wen, Trelawnyd", "well", "wa", 53.31174, -3.37945, "Stone-built well chamber with a twin structure beside a pond inside a polygonal enclosure; much of the setting was dug out after 2001 to make a duck pond, exposing the footings. On private land.", "https://coflein.gov.uk/en/site/32318"], ["Ffynnon Mihangel / St Michael's Well, Cilcain", "well", "wa", 53.17514, -3.23681, "Holy well dedicated to St Michael, already ruinous when Edward Lhuyd noted it c.1700; now just a shallow overgrown hollow.", "https://coflein.gov.uk/en/site/32327"], ["Ffynnon Fair, Halkyn", "well", "wa", 53.22995, -3.18566, "St Mary's well in the south corner of Halkyn old churchyard: a round stone basin recorded by Lhuyd in 1699, now capped with slabs that are probably reused gravestones.", "https://coflein.gov.uk/en/site/32312"], ["Ffynnon Leinw, Cilcain", "well", "wa", 53.19986, -3.21956, "Medieval stone-lined well basin long credited with medicinal water, traditionally linked to Gerald of Wales's journey through the area in 1188.", "https://coflein.gov.uk/en/site/32315"], ["Ffynnon Mihangel, Caerwys", "well", "wa", 53.24593, -3.31596, "Spring rising in a natural limestone basin near Caerwys, dedicated to St Michael and listed by Edward Lhuyd c.1699.", "https://coflein.gov.uk/en/site/32316"], ["Ffynnon Deg, Caerwys", "well", "wa", 53.24826, -3.30052, "Rectangular walled well enclosure about 8 by 4 yards outside Caerwys, recorded by Edward Lhuyd; on farmland.", "https://coflein.gov.uk/en/site/32311"], ["Ffynnon Fair / St Mary's Well, Cwm Vicarage", "well", "wa", 53.28161, -3.41133, "Well dedicated to the Virgin by the old vicarage at Cwm, mentioned by Edward Lhuyd around 1700; little is recorded of its present state. Location approximate.", "https://coflein.gov.uk/en/site/32314"], ["Ffynnon Ddier / Ffynnon Deifer, Bodfari", "well", "wa", 53.21917, -3.36179, "Holy well of St Deifer (Dier), the original patron of Bodfari church; once a resort for sick children, it is now a neglected spring.", "https://coflein.gov.uk/en/site/32310"], ["Ffynnon Gynhafal / St Cynhafal's Well", "well", "wa", 53.1645, -3.29813, "Wart-curing well of St Cynhafal near Llangynhafal, praised in a late-medieval poem; the present chamber is a modern rebuild tied to field drainage. On private land.", "https://coflein.gov.uk/en/site/32293"], ["Ffynnon Oerog / Holy Well, Trevor", "well", "wa", 52.97099, -3.09904, "The strongest of a cluster of cold springs near Trevor, Llangollen, enclosed in a small brick surround and once much visited by sufferers of rheumatism.", "https://coflein.gov.uk/en/site/32280"], ["Ffynnon Fair / St Melyd's Well, Meliden", "well", "wa", 53.32102, -3.40092, "Small boundary well between Meliden and Gwaenysgor associated with St Mary and the local saint Melyd; now largely dry.", "https://coflein.gov.uk/en/site/32326"], ["Ffynnon Fael a Sulien, Cwm", "well", "wa", 53.28577, -3.40171, "Medicinal spring by Cwm vicarage named for the paired saints Mael and Sulien; steps lead down to water protected by an old grave slab, renovated in 1772.", "https://coflein.gov.uk/en/site/32329"], ["St Garmon's Well, Llandegla", "well", "wa", 53.07187, -3.21698, "Stone-lined spring under a bank on a disused road, walled on three sides, dedicated to St Garmon (Germanus); a cross wall once ponded the outflow.", "https://coflein.gov.uk/en/site/32296"], ["Ffynnon Benno, Gwyddelwern", "well", "wa", 53.01158, -3.37895, "Sunken slate-lined well enclosure regarded as a sacred well of St Beuno, about 6 by 5 feet and 3 feet deep.", "https://coflein.gov.uk/en/site/32371"], ["Ffynnon Asa, Cwm (Dyserth)", "well", "wa", 53.29922, -3.3891, "Powerful spring of St Asaph, said in Lhuyd's day to ebb and flow and to rival Holywell in volume, once framed by pillars and driving a mill; now absorbed into a modern reservoir.", "https://coflein.gov.uk/en/site/32303"], ["St Mordeyrn's Well, Nantglyn", "well", "wa", 53.14796, -3.49023, "Site of the well of St Mordeyrn, patron of Nantglyn church, about 250 yards north of the church; the ground is still damp but no structure survives.", "https://coflein.gov.uk/en/site/32298"], ["Ffynnon Trillo, Llandrillo (Edeirnion)", "well", "wa", 52.92616, -3.4405, "Spring roughly 420m north of St Trillo's church in Llandrillo, Edeirnion, named for the church's saint and shown on 1890s OS maps. Distinct from St Trillo's Chapel at Rhos-on-Sea.", "https://coflein.gov.uk/en/site/32388"], ["St Dogfan's Holy Well (upland site)", "well", "wa", 52.8666, -3.3568, "Peat-cut, stone-ended trough fed by clear seepage on open moorland, identified as a site of St Dogfan's well; recorded from air photographs in 2007.", "https://coflein.gov.uk/en/site/295323"], ["St Mary's Well, Betws Gwerfil Goch", "well", "wa", 53.00795, -3.44262, "Well dedicated to the Virgin that Lhuyd placed 'a stone's throw from the church' of Betws Gwerfil Goch.", "https://coflein.gov.uk/en/site/32398"], ["St Mary's Well and Bath, Bodrhyddan", "well", "wa", 53.29707, -3.43419, "Ornate octagonal well house with cupola and pelican finial plus a balustraded bath in the grounds of Bodrhyddan Hall; it bears a spurious 'Inigo Jones 1612' inscription but seems to be 18th century. Private estate.", "https://coflein.gov.uk/en/site/32325"], ["Ffynnon Beuno, Tremeirchion", "well", "wa", 53.24024, -3.37475, "Medieval bathing well of St Beuno below the Ffynnon Beuno caves: a walled pool whose overflow spouts through a worn carved stone head. Beside a private house.", "https://coflein.gov.uk/en/site/32306"], ["Ffynnon Sara, Derwen", "well", "wa", 53.05317, -3.39743, "Open spring with three stone steps down to the water near Derwen, recorded by Lhuyd in 1698; traditionally a healing well for rheumatism.", "https://coflein.gov.uk/en/site/32282"], ["Ffynnon Tysilio, Bryneglwys", "well", "wa", 53.01188, -3.29668, "Well of St Tysilio noted by Edward Lhuyd in 1698 near Bryneglwys; its precise position is now uncertain (location approximate).", "https://coflein.gov.uk/en/site/32286"], ["Ffynnon Wen, Trefnant", "well", "wa", 53.20721, -3.46833, "Ruined spring complex near Trefnant with a well, bath house and a dressing room with fireplace, showing its use as a bathing well.", "https://coflein.gov.uk/en/site/32287"], ["Ffynnon Sadwrn, Denbigh", "well", "wa", 53.19338, -3.43732, "Well of St Sadwrn near Denbigh, recorded by Lhuyd in 1698; a low footstone fronts a chamber protected by rough walling.", "https://coflein.gov.uk/en/site/32281"], ["Ffynnon Farchweil, Denbigh", "well", "wa", 53.18406, -3.39705, "Old well near Denbigh noted by Edward Lhuyd in 1698; only the channel that carried its outflow survives.", "https://coflein.gov.uk/en/site/32277"], ["Ffynnon Elidan, Llanelidan", "well", "wa", 53.02093, -3.33199, "Well of St Elidan near Cefn-y-wern farm, Llanelidan; it has silted up and its exact site is lost (location approximate).", "https://coflein.gov.uk/en/site/32272"], ["Ffynnon Fair, Penycae", "well", "wa", 53.00118, -3.09027, "Spring dedicated to St Mary rising in a field named after it on the P tructure in a hillside recess.", "https://coflein.gov.uk/en/site/307716"], ["St Anne's Well, Llanmihangel", "well", "wa", 51.43689, -3.46725, "Rectangular stone chamber with a carved panel, linked to the Llanmihangel Place gardens.", "https://coflein.gov.uk/en/site/307609"], ["St Mary's Well, Llanfair (Vale)", "well", "wa", 51.43697, -3.4402, "Holy well north of St Mary's church at Llanfair, a slab-covered chamber with an attached brick cistern.", "https://coflein.gov.uk/en/site/32358"], ["St John's Well, St Athan", "well", "wa", 51.40505, -3.41777, "Holy well at Beggars Bound, walled and railed.", "https://coflein.gov.uk/en/site/32355"], ["Holy Well, Coedrhydyglyn", "well", "wa", 51.47561, -3.31168, "Roadside well on the way to Peterston reputed to cure eye disorders (location approximate).", "https://coflein.gov.uk/en/site/32335"], ["Ffynnon y Green, St Athan", "well", "wa", 51.39337, -3.42431, "Holy well said to cure sore eyes if bathed in before sunrise (location approximate).", "https://coflein.gov.uk/en/site/32346"], ["Llancarfan Holy Well", "well", "wa", 51.42148, -3.36396, "Holy well said to cure scrofula (the King's Evil).", "https://coflein.gov.uk/en/site/32344"], ["Ffynnon y Drindod, Llandow", "well", "wa", 51.45229, -3.52991, "Trinity spring near the source of the Afon Alun with possible traces of stonework.", "https://coflein.gov.uk/en/site/307628"], ["Petrifying Well, Lymm", "spring", "en", 53.3834, -2.47503, "A lime-laden spring by Ridding's Brook near Lymm Dam that turned mosses and twigs to stone, recorded by the Victorian botanist Leo Grindon; exact spot now uncertain, location approximate.", "https://www.thenorthernantiquarian.org/2026/08/28/petrifying-well-lymm/"], ["Billy Hobby's Well, Chester", "well", "en", 53.19009, -2.87923, "Spring on the edge of Chester known from 18th-century field names; 'Hobby' may echo the hob, a goblin or demon name, hinting at old folklore attached to the water.", "https://www.thenorthernantiquarian.org/2014/06/13/bi
